<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>No Signal — Annmary Saji</title>
<link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=general-sans@400,500,600&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=general-sans@400,500,600&display=swap"/></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'General Sans',system-ui,sans-serif;
  background:#050407;color:#F0EEF5;cursor:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;user-select:none;
}
#cur{position:fixed;top:0;left:0;width:24px;height:24px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
.c{position:fixed;width:15px;height:15px;opacity:.2;z-index:2;}
.c-tl{top:1.5rem;left:1.5rem;border-top:1px solid rgba(240,238,245,.35);border-left:1px solid rgba(240,238,245,.35);}
.c-tr{top:1.5rem;right:1.5rem;border-top:1px solid rgba(240,238,245,.35);border-right:1px solid rgba(240,238,245,.35);}
.c-bl{bottom:1.5rem;left:1.5rem;border-bottom:1px solid rgba(240,238,245,.35);border-left:1px solid rgba(240,238,245,.35);}
.c-br{bottom:1.5rem;right:1.5rem;border-bottom:1px solid rgba(240,238,245,.35);border-right:1px solid rgba(240,238,245,.35);}
.back{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);z-index:10;font-size:.68rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,238,245,.24);text-decoration:none;transition:color .2s;white-space:nowrap;}
.back:hover{color:rgba(240,238,245,.7);}
.shell{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.85rem;}
.top-row{display:flex;align-items:baseline;justify-content:center;gap:2.5rem;flex-wrap:wrap;width:100%;}
.status-msg{font-family:'Clash Display',Georgia,serif;font-size:clamp(.68rem,1.8vw,.86rem);font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(240,238,245,.2);}
.score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:.05rem;}
.score-label{font-size:.54rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(240,238,245,.2);}
.score-val{font-family:'Clash Display',Georgia,serif;font-size:clamp(1rem,3vw,1.6rem);font-weight:700;letter-spacing:-.02em;color:#F0EEF5;line-height:1;}
.canvas-wrap{position:relative;}
#game{display:block;border:1px solid rgba(240,238,245,.06);border-radius:3px;box-shadow:0 0 80px rgba(5,4,7,.9),inset 0 0 100px rgba(5,4,7,.5);image-rendering:auto;}
.canvas-wrap::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:3px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0px,rgba(0,0,0,.045) 1px,transparent 1px,transparent 3px);z-index:1;}
.prompt{font-family:'Clash Display',Georgia,serif;font-size:clamp(.85rem,2vw,1.02rem);font-weight:600;letter-spacing:-.01em;color:rgba(240,238,245,.28);text-align:center;transition:opacity .4s;}
.prompt span{color:#F0EEF5;}
.hi-wrap{display:flex;align-items:center;gap:1.5rem;}
.hi-block{display:flex;flex-direction:column;align-items:center;gap:.08rem;}
.hi-label{font-size:.54rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,238,245,.2);}
.hi-val{font-family:'Clash Display',Georgia,serif;font-size:clamp(.86rem,2.2vw,1.12rem);font-weight:700;color:#F0EEF5;}
.hi-sep{width:1px;height:18px;background:rgba(240,238,245,.1);}
@media (pointer: coarse), (max-width: 768px) {
  #cur { display: none !important; }
  body { cursor: auto !important; }
  .back { font-size: 0.85rem !important; top: 1.2rem !important; }
}
</style>
</head>
<body>
<div class="c c-tl"></div><div class="c c-tr"></div><div class="c c-bl"></div><div class="c c-br"></div>
<a href="portfolio.html" class="back">← Annmary Saji</a>
<div id="cur">
  <svg id="csq" width="24" height="24" viewBox="0 0 30 30">
    <defs><filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path id="sf" d="M15,1.5 L17.7,9.8 L26.6,9.8 L19.7,14.8 L22.2,23.1 L15,18.2 L7.8,23.1 L10.3,14.8 L3.4,9.8 L12.3,9.8 Z" fill="#D93020" stroke="rgba(217,48,32,.35)" stroke-width="1" filter="url(#gl)"/>
  </svg>
</div>
<div class="shell">
  <div class="top-row">
    <p class="status-msg" id="statusMsg">No signal detected.</p>
    <div class="score-wrap"><span class="score-label">Score</span><span class="score-val" id="scoreDisp">0</span></div>
  </div>
  <div class="canvas-wrap"><canvas id="game"></canvas></div>
  <p class="prompt" id="prompt">Press <span>Space</span> or <span>↑</span> or tap to launch</p>
  <div class="hi-wrap">
    <div class="hi-block"><span class="hi-label">Best</span><span class="hi-val" id="hiDisp">0</span></div>
    <div class="hi-sep"></div>
    <div class="hi-block"><span class="hi-label">Last</span><span class="hi-val" id="lastDisp">—</span></div>
  </div>
</div>

<script>
  /* ✦✦ CURSOR (Desktop only) ✦✦ */
  const cur = document.getElementById('cur'), csq = document.getElementById('csq');
  let mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my, lx = mx, ly = my, ang = 0;
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  
  if (!isTouch) {
      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
      (function cl(){
          cx += (mx - cx) * 0.16;
          cy += (my - cy) * 0.16;
          if (cur) {
              cur.style.left = cx + 'px';
              cur.style.top = cy + 'px';
              const sp = Math.hypot(mx - lx, my - ly);
              lx = mx; ly = my;
              ang += 1 + sp * 0.5;
              csq.style.transform = 'rotate(' + ang + 'deg)';
          }
          requestAnimationFrame(cl);
      })();
  } else {
      if (cur) cur.style.display = 'none';
      document.body.style.cursor = 'auto';
  }
  
  /* ✦✦ GAME ENGINE (LUNAR RUNNER) ✦✦ */
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const $$ = id => document.getElementById(id);
  const scoreDisp = $$('scoreDisp'), hiDisp = $$('hiDisp'), lastDisp = $$('lastDisp'), promptEl = $$('prompt'), statusMsg = $$('statusMsg');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const CW = Math.min(680, window.innerWidth - 40), CH = 210;
  canvas.width = CW * DPR; canvas.height = CH * DPR; canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.scale(DPR, DPR);
  
  /* Constants */
  const GY = CH - 45, PLANET_R = 1200; 
  const GRAVITY = 0.68, JUMP_V = -9.0, DBLJ_V = -8.0, STAR_R = 13, STAR_X = 90, CEIL_Y = STAR_R + 10;
  const BASE_SPD = 5.0, SPD_INC = 0.0008, MAX_SPD = 14;
  
  /* Moon visual dots */
  const MOON_DOTS = Array.from({length: 80}, () => ({
      ang: (Math.random() - 0.5) * 1.2, 
      depth: Math.random() * 40,
      r: 0.5 + Math.random() * 1.5
  }));

  const BG_STARS = Array.from({length: 85}, () => ({
    x: Math.random() * CW, y: Math.random() * (GY - 6),
    r: 0.4 + Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2,
    twinkleSpd: 0.025 + Math.random() * 0.07,
    speed: 0.06 + Math.random() * 0.16
  }));
  
  const SHOOTS = [];
  function mkShoot(){
    return {
      x: CW * 0.25 + Math.random() * CW * 0.8, y: Math.random() * (GY * 0.45),
      vx: -(3.5 + Math.random() * 7), vy: 0.8 + Math.random() * 2.2,
      len: 55 + Math.random() * 95, alpha: 0, active: false, life: 0,
      delay: Math.floor(Math.random() * 360 + 120)
    };
  }
  for (let i = 0; i < 5; i++) SHOOTS.push(mkShoot());
  
  /* Player */
  let star = { x: STAR_X, y: GY - STAR_R, vy: 0, rot: 0, grounded: true, jumps: 0 };
  let jumpHeld = false, starSX = 1, starSY = 1, wasGrounded = true;
  
  /* State */
  let obstacles = [], nextObs = 80, particles = [], state = 'idle';
  let score = 0, hi = 0, last = 0, speed = BASE_SPD, elapsed = 0, flashTimer = 0, trail = [];
  let planetAngOffset = 0;

  /* Milestones */
  const milestones = [
      { s: 50, m: "Annmary is a visual storyteller." },
      { s: 150, m: "BFA Animation @ NTU ADM." },
      { s: 250, m: "Selected for Annecy 2025." },
      { s: 350, m: "Multidisciplinary creative." },
      { s: 450, m: "Animator, Illustrator, Designer." }
  ];
  let curMilestone = null;
  let milestoneTimer = 0;
  
  /* Initial Prompt */
  promptEl.innerHTML = isTouch ? '<span>Tap anywhere</span> to launch' : '<span>Space</span> / click to launch';
  
  /* Input Handlers */
  function tryJump(){
    if (state === 'idle' || state === 'dead') { startGame(); return; }
    if (star.jumps < 2) {
      star.vy = star.jumps === 0 ? JUMP_V : DBLJ_V;
      star.grounded = false; star.jumps++;
      starSX = 0.65; starSY = 1.48;
      spawnJumpPfx(); jumpHeld = true;
    }
  }
  function releaseJump(){ jumpHeld = false; }
  
  document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tryJump(); } });
  document.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') releaseJump(); });
  
  window.addEventListener('touchstart', e => {
      if (e.target.closest('.back')) return;
      e.preventDefault();
      tryJump();
  }, { passive: false });
  window.addEventListener('touchend', e => {
      if (e.target.closest('.back')) return;
      releaseJump();
  });
  
  canvas.addEventListener('mousedown', tryJump);
  canvas.addEventListener('mouseup', releaseJump);
  
  /* Start Game */
  function startGame(){
    state = 'running'; score = 0; speed = BASE_SPD; elapsed = 0; planetAngOffset = 0;
    star = { x: STAR_X, y: GY - STAR_R, vy: 0, rot: 0, grounded: true, jumps: 0 };
    starSX = 1; starSY = 1; wasGrounded = true;
    obstacles = []; particles = []; trail = []; nextObs = 80; flashTimer = 0;
    curMilestone = null; milestoneTimer = 0;
    promptEl.style.opacity = '0'; statusMsg.textContent = 'Orbit maintained.';
  }
  
  function obsGap(){
    const base = 85 - Math.floor(elapsed / 320) * 5;
    return Math.max(Math.floor(base + Math.random() * 88), 38);
  }
  
  function spawnObs(){
    const tier = score < 100 ? 0 : score < 220 ? 1 : 2;
    const r = Math.random();
    let variant, w, h;
    
    // Spawn a natural lunar crater or rock
    if (Math.random() < 0.28) {
        variant = 'crater';
        w = 36 + Math.random() * 26;
        h = 16;
    } else {
        if (tier === 0) {
          if (r < 0.5) { variant = 'rock'; w = 20 + r * 38; h = 15 + Math.random() * 20; }
          else { variant = 'crystal'; w = 15; h = 24 + Math.random() * 12; }
        } else if (tier === 1) {
          if (r < 0.35) { variant = 'rock'; w = 25; h = 22; }
          else if (r < 0.70) { variant = 'double'; w = 36; h = 25; }
          else { variant = 'crystal'; w = 16; h = 32; }
        } else {
          if (r < 0.30) { variant = 'double'; w = 38; h = 28; }
          else if (r < 0.65) { variant = 'tall'; w = 20; h = 38; }
          else { variant = 'crystal'; w = 18; h = 36; }
        }
    }
    
    const dist = CW - STAR_X + 60;
    const ang = dist / PLANET_R;
    obstacles.push({ ang, variant, w, h, scored: false });
  }
  
  /* Particles */
  function spawnJumpPfx(){
    for (let i = 0; i < 8; i++) {
      const a = Math.PI + (Math.random() - 0.5) * 1.2;
      particles.push({ x: star.x, y: star.y + STAR_R * 0.7, vx: Math.cos(a) * (1 + Math.random() * 3), vy: Math.sin(a) * (1 + Math.random() * 3) - 0.5, life: 1, decay: 0.06 + Math.random() * 0.04, r: 0.8 + Math.random() * 1.8, col: '#FFFFFF', type: 'd' });
    }
  }
  function spawnLandPfx(){
    for (let i = 0; i < 6; i++) {
      particles.push({ x: star.x + (Math.random() - 0.5) * STAR_R, y: star.y + STAR_R, vx: (Math.random() - 0.5) * 3, vy: -(Math.random() * 2.2), life: 1, decay: 0.07 + Math.random() * 0.05, r: 0.7 + Math.random() * 1.5, col: 'rgba(200,196,228,1)', type: 'd' });
    }
  }
  function spawnDeathPfx(){
    const cols = ['#D93020', '#FF6654', '#E8B000', '#FF9944', '#FF4433'];
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
      particles.push({ x: star.x, y: star.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 1, decay: 0.02 + Math.random() * 0.03, r: 2 + Math.random() * 4, col: cols[Math.floor(Math.random() * cols.length)], type: 's' });
    }
  }
  function spawnScorePfx(x, y){
    for (let i = 0; i < 5; i++) {
      particles.push({ x, y, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() * 2.5, life: 1, decay: 0.06, r: 1, col: 'rgba(255,255,255,0.75)', type: 'd' });
    }
  }
  
  /* DRAWING HELPERS */
  function drawStar(x, y, r, rot, sx, sy){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy);
    ctx.shadowColor = 'rgba(217,48,32,.85)'; ctx.shadowBlur = 8 + sy * 9;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i * Math.PI / 5) - Math.PI / 2, rad = i % 2 === 0 ? r : r * 0.42;
      i === 0 ? ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad) : ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = '#D93020'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,120,.8)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  
  const obsImgs = {
      rock: new Image(),
      crystal: new Image(),
      tall: new Image(),
      double: new Image()
  };
  obsImgs.rock.src = 'assets/rocks/rock1.svg';
  obsImgs.crystal.src = 'assets/rocks/crystal.svg';
  obsImgs.tall.src = 'assets/rocks/tall.svg';
  obsImgs.double.src = 'assets/rocks/double.svg';
  
  /* HIT TEST */
  function hitTest(){
    const HR = STAR_R * 0.58;
    for (const o of obstacles) {
      const linearX = STAR_X + (o.ang * PLANET_R);
      const l = linearX - o.w / 2;
      const r = linearX + o.w / 2;
      
      if (o.variant === 'crater') {
          if (star.x > l + 6 && star.x < r - 6) {
              if (star.y >= GY - STAR_R - 3) return true;
          }
      } else {
          const t = GY - o.h;
          const nx = Math.max(l, Math.min(star.x, r)), ny = Math.max(t, Math.min(star.y, GY));
          if (Math.hypot(star.x - nx, star.y - ny) < HR) return true;
      }
    }
    return false;
  }
  
  /* UPDATE WITH DELTA TIME (Normalized for 60Hz - 240Hz screens) */
  function update(dt = 1){
    if (state !== 'running') return;
    elapsed += dt;
    speed = Math.min(MAX_SPD, BASE_SPD + elapsed * SPD_INC);
    score = Math.floor(elapsed / 5);
    scoreDisp.textContent = score;
    
    // Milestones
    const reached = milestones.find(m => score === m.s);
    if (reached && (!curMilestone || curMilestone.s !== reached.s)) {
        curMilestone = reached;
        milestoneTimer = 220;
    }
    if (milestoneTimer > 0) milestoneTimer -= dt;

    trail.unshift({ x: star.x, y: star.y, life: 1 });
    if (trail.length > 20) trail.pop();
    trail.forEach(p => p.life -= 0.055 * dt);
    
    const g = (jumpHeld && star.vy < 0 ? GRAVITY * 0.6 : GRAVITY) * dt;
    star.vy += g;
    star.y += star.vy * dt;
    
    if (star.y >= GY - STAR_R) {
      if (!wasGrounded) { spawnLandPfx(); starSX = 1.52; starSY = 0.58; }
      star.y = GY - STAR_R; star.vy = 0; star.grounded = true; star.jumps = 0;
    } else star.grounded = false;
    
    if (star.y < CEIL_Y) { star.y = CEIL_Y; star.vy = Math.max(star.vy, 0); }
    wasGrounded = star.grounded;
    
    starSX += (1 - starSX) * (0.2 * dt);
    starSY += (1 - starSY) * (0.2 * dt);
    star.rot += (star.grounded ? 0.022 : 0.1) * dt;
  
    const angularSpeed = (speed / PLANET_R) * dt;
    planetAngOffset -= angularSpeed;

    nextObs -= dt;
    if (nextObs <= 0) { spawnObs(); nextObs = obsGap(); }
    
    for (const o of obstacles) {
        o.ang -= angularSpeed;
        const linearX = STAR_X + (o.ang * PLANET_R);
        if (!o.scored && linearX + o.w / 2 < star.x) {
            o.scored = true;
            spawnScorePfx(star.x, star.y - STAR_R);
        }
    }
    obstacles = obstacles.filter(o => (o.ang * PLANET_R) > -100);
    
    if (hitTest()) die();
    
    BG_STARS.forEach(s => { s.x -= s.speed * dt; if (s.x < 0) s.x = CW; s.twinkle += s.twinkleSpd * dt; });
    SHOOTS.forEach(s => {
      if (s.delay > 0) { s.delay -= dt; return; }
      if (!s.active) { s.active = true; s.life = 0; }
      s.x += s.vx * dt; s.y += s.vy * dt; s.life += dt;
      if (s.life < 8) s.alpha = s.life / 8;
      else if (s.x < -70 || s.y > GY + 10) {
          Object.assign(s, mkShoot());
      }
      else s.alpha = Math.max(0, s.alpha - 0.016 * dt);
    });
    
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.11 * dt; p.life -= p.decay * dt; });
    particles = particles.filter(p => p.life > 0);
    if (flashTimer > 0) flashTimer -= dt;
  }
  
  function die(){
    state = 'dead'; last = score; if (score > hi) hi = score;
    hiDisp.textContent = hi; lastDisp.textContent = last;
    spawnDeathPfx(); flashTimer = 14;
    promptEl.style.opacity = '1';
    promptEl.innerHTML = isTouch ? '<span>Tap anywhere</span> to re-launch' : '<span>Space</span> / click to re-launch';
    statusMsg.textContent = 'Signal lost.';
  }
  
  /* DRAW */
  function draw(){
    if (flashTimer > 0 && flashTimer % 2 === 0) { ctx.fillStyle = 'rgba(217,48,32,.13)'; ctx.fillRect(0, 0, CW, CH); return; }
    ctx.clearRect(0, 0, CW, CH);
    
    // Sky
    ctx.fillStyle = '#050407'; ctx.fillRect(0, 0, CW, CH);
    
    // Background Stars
    ctx.fillStyle = '#F0EEF5';
    BG_STARS.forEach(s => {
      ctx.globalAlpha = Math.abs(Math.sin(s.twinkle));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    // Shooting Stars
    ctx.lineWidth = 1.5;
    SHOOTS.forEach(s => {
      if (!s.active) return;
      ctx.globalAlpha = s.alpha;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 5, s.y - s.vy * 5);
      grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * (s.len / 10), s.y - s.vy * (s.len / 10)); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    const CX = STAR_X;
    const CY = GY + PLANET_R;
    
    ctx.save();
    ctx.translate(CX, CY);
    
    // Draw base moon
    ctx.beginPath();
    ctx.arc(0, 0, PLANET_R, 0, Math.PI * 2);
    ctx.fillStyle = '#E5E2EC';
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#D93020';
    ctx.stroke();

    // Draw Moon Dots (Craters / Texture)
    ctx.fillStyle = 'rgba(5,4,7,0.15)';
    MOON_DOTS.forEach(d => {
        const a = d.ang + planetAngOffset;
        const rad = PLANET_R - d.depth;
        const dx = Math.sin(a) * rad;
        const dy = -Math.cos(a) * rad;
        ctx.beginPath(); ctx.arc(dx, dy, d.r, 0, Math.PI * 2); ctx.fill();
    });

    // Draw Obstacles & Craters
    obstacles.forEach(o => {
        ctx.save();
        ctx.rotate(o.ang);
        
        if (o.variant === 'crater') {
            // Natural lunar crater bowl (no harsh outside circle)
            ctx.beginPath();
            ctx.arc(0, -PLANET_R, o.w / 2, 0, Math.PI, false);
            ctx.fillStyle = '#050407'; // Deep dark void
            ctx.fill();

            // Inner crater shadow
            const crGrad = ctx.createLinearGradient(0, -PLANET_R, 0, -PLANET_R + o.w / 2);
            crGrad.addColorStop(0, 'rgba(0,0,0,0.85)');
            crGrad.addColorStop(1, 'rgba(10,8,15,0.4)');
            ctx.fillStyle = crGrad;
            ctx.fill();

            // Subtle crater rim highlight along lunar surface
            ctx.beginPath();
            ctx.arc(0, -PLANET_R, o.w / 2, 0.05, Math.PI - 0.05, false);
            ctx.strokeStyle = 'rgba(217, 48, 32, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        } else {
            if (obsImgs[o.variant] && obsImgs[o.variant].complete) {
                ctx.drawImage(obsImgs[o.variant], -o.w / 2, -PLANET_R - o.h + 1, o.w, o.h);
            } else {
                ctx.fillStyle = '#111009';
                ctx.fillRect(-o.w / 2, -PLANET_R - o.h, o.w, o.h);
            }
        }
        ctx.restore();
    });
    ctx.restore();
    
    // Player Trail
    ctx.beginPath();
    trail.forEach((p, i) => {
      ctx.lineWidth = p.life * 5; ctx.strokeStyle = `rgba(217,48,32,${p.life * 0.4})`;
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
    
    // Player
    if (state !== 'dead') drawStar(star.x, star.y, STAR_R, star.rot, starSX, starSY);
    
    // Particles
    particles.forEach(p => {
      ctx.fillStyle = p.col; ctx.beginPath();
      if (p.type === 's') ctx.rect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      else ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Milestones
    if (curMilestone && milestoneTimer > 0) {
        ctx.save();
        const alpha = milestoneTimer > 180 ? (220 - milestoneTimer) / 40 : (milestoneTimer < 40 ? milestoneTimer / 40 : 1);
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.fillStyle = '#F0EEF5';
        ctx.textAlign = 'center';
        ctx.font = '600 clamp(0.7rem, 2.5vw, 1.1rem) "Clash Display", sans-serif';
        ctx.shadowColor = 'rgba(5,4,7,0.9)';
        ctx.shadowBlur = 8;
        ctx.fillText(curMilestone.m, CW / 2, CH * 0.35);
        ctx.restore();
    }
    
    // Intro Prompt
    if (state === 'idle') {
      ctx.fillStyle = 'rgba(240,238,245,.8)'; ctx.textAlign = 'center';
      ctx.font = '500 1rem "General Sans",sans-serif';
      ctx.fillText(isTouch ? 'Tap Anywhere to Launch' : 'Press Space to Launch', CW / 2, CH / 2);
    }
  }
  
  let lastTime = performance.now();
  function loop(now){
    const dt = Math.min(2.0, Math.max(0.2, ((now - lastTime) || 16.666) / 16.666));
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  
  window.addEventListener('pageshow', function() {
      document.body.style.opacity = '1';
      document.body.style.visibility = 'visible';
  });
</script>
</body>
