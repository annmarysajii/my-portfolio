<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>No Signal — Annmary Saji</title>
<link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=general-sans@400,500,600&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=general-sans@400,500,600&display=swap"/></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'General Sans',system-ui,sans-serif;
  background:#050407;color:#F0EEF5;cursor:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;user-select:none;
}
#cur{position:fixed;top:0;left:0;width:24px;height:24px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
.c{position:fixed;width:15px;height:15px;opacity:.2;z-index:2;}
.c-tl{top:1.5rem;left:1.5rem;border-top:1px solid rgba(240,238,245,.35);border-left:1px solid rgba(240,238,245,.35);}
.c-tr{top:1.5rem;right:1.5rem;border-top:1px solid rgba(240,238,245,.35);border-right:1px solid rgba(240,238,245,.35);}
.c-bl{bottom:1.5rem;left:1.5rem;border-bottom:1px solid rgba(240,238,245,.35);border-left:1px solid rgba(240,238,245,.35);}
.c-br{bottom:1.5rem;right:1.5rem;border-bottom:1px solid rgba(240,238,245,.35);border-right:1px solid rgba(240,238,245,.35);}
.back{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);z-index:10;font-size:.68rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,238,245,.24);text-decoration:none;transition:color .2s;white-space:nowrap;}
.back:hover{color:rgba(240,238,245,.7);}
.shell{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.85rem;}
.top-row{display:flex;align-items:baseline;justify-content:center;gap:2.5rem;flex-wrap:wrap;width:100%;}
.status-msg{font-family:'Clash Display',Georgia,serif;font-size:clamp(.68rem,1.8vw,.86rem);font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(240,238,245,.2);}
.score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:.05rem;}
.score-label{font-size:.54rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(240,238,245,.2);}
.score-val{font-family:'Clash Display',Georgia,serif;font-size:clamp(1rem,3vw,1.6rem);font-weight:700;letter-spacing:-.02em;color:#F0EEF5;line-height:1;}
.canvas-wrap{position:relative;}
#game{display:block;border:1px solid rgba(240,238,245,.06);border-radius:3px;box-shadow:0 0 80px rgba(5,4,7,.9),inset 0 0 100px rgba(5,4,7,.5);image-rendering:auto;}
.canvas-wrap::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:3px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0px,rgba(0,0,0,.045) 1px,transparent 1px,transparent 3px);z-index:1;}
.prompt{font-family:'Clash Display',Georgia,serif;font-size:clamp(.85rem,2vw,1.02rem);font-weight:600;letter-spacing:-.01em;color:rgba(240,238,245,.28);text-align:center;transition:opacity .4s;}
.prompt span{color:#F0EEF5;}
.hi-wrap{display:flex;align-items:center;gap:1.5rem;}
.hi-block{display:flex;flex-direction:column;align-items:center;gap:.08rem;}
.hi-label{font-size:.54rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,238,245,.2);}
.hi-val{font-family:'Clash Display',Georgia,serif;font-size:clamp(.86rem,2.2vw,1.12rem);font-weight:700;color:#F0EEF5;}
.hi-sep{width:1px;height:18px;background:rgba(240,238,245,.1);}
</style>
</head>
<body>
<div class="c c-tl"></div><div class="c c-tr"></div><div class="c c-bl"></div><div class="c c-br"></div>
<a href="portfolio.html" class="back">← Annmary Saji</a>
<div id="cur">
  <svg id="csq" width="24" height="24" viewBox="0 0 30 30">
    <defs><filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path id="sf" d="M15,1.5 L17.7,9.8 L26.6,9.8 L19.7,14.8 L22.2,23.1 L15,18.2 L7.8,23.1 L10.3,14.8 L3.4,9.8 L12.3,9.8 Z" fill="#D93020" stroke="rgba(217,48,32,.35)" stroke-width="1" filter="url(#gl)"/>
  </svg>
</div>
<div class="shell">
  <div class="top-row">
    <p class="status-msg" id="statusMsg">No signal detected.</p>
    <div class="score-wrap"><span class="score-label">Score</span><span class="score-val" id="scoreDisp">0</span></div>
  </div>
  <div class="canvas-wrap"><canvas id="game"></canvas></div>
  <p class="prompt" id="prompt">Press <span>Space</span> or <span>↑</span> or tap to launch</p>
  <div class="hi-wrap">
    <div class="hi-block"><span class="hi-label">Best</span><span class="hi-val" id="hiDisp">0</span></div>
    <div class="hi-sep"></div>
    <div class="hi-block"><span class="hi-label">Last</span><span class="hi-val" id="lastDisp">—</span></div>
  </div>
</div>

<script>
/* ── CURSOR ── */
const cur=document.getElementById('cur'),csq=document.getElementById('csq');
let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,lx=mx,ly=my,ang=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function cl(){cx+=(mx-cx)*.16;cy+=(my-cy)*.16;cur.style.left=cx+'px';cur.style.top=cy+'px';const sp=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;ang+=1+sp*.5;csq.style.transform='rotate('+ang+'deg)';requestAnimationFrame(cl);})();

/* ════════ GAME ════════ */
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $$=id=>document.getElementById(id);
const scoreDisp=$$('scoreDisp'),hiDisp=$$('hiDisp'),lastDisp=$$('lastDisp'),promptEl=$$('prompt'),statusMsg=$$('statusMsg');
const DPR=Math.min(window.devicePixelRatio||1,2);
const CW=Math.min(680,window.innerWidth-40),CH=210;
canvas.width=CW*DPR;canvas.height=CH*DPR;canvas.style.width=CW+'px';canvas.style.height=CH+'px';
ctx.scale(DPR,DPR);

/* Constants */
const GY=CH-40,GRAVITY=0.68,JUMP_V=-9.0,DBLJ_V=-8.0,STAR_R=13,STAR_X=72,CEIL_Y=STAR_R+10;
const BASE_SPD=5.0,SPD_INC=0.0008,MAX_SPD=14;

/* ── BG WHITE STARS ── */
const BG_STARS=Array.from({length:105},()=>({
  x:Math.random()*CW,y:Math.random()*(GY-6),
  r:.4+Math.random()*1.5,twinkle:Math.random()*Math.PI*2,
  twinkleSpd:.025+Math.random()*.07,speed:.06+Math.random()*.16,
  isCross:Math.random()<.07
}));

/* ── SHOOTING STARS ── */
function mkShoot(s){
  s.x=CW*.25+Math.random()*CW*.8;s.y=Math.random()*(GY*.45);
  s.vx=-(3.5+Math.random()*7);s.vy=.8+Math.random()*2.2;
  s.len=55+Math.random()*95;s.alpha=0;s.active=false;s.life=0;
  s.delay=Math.floor(Math.random()*360+120);return s;
}
const SHOOTS=Array.from({length:5},()=>mkShoot({}));

/* ── GROUND SURFACE DOTS ── */
const GDUST=Array.from({length:20},()=>({x:Math.random()*CW,w:3+Math.random()*14,h:1+Math.random()*3,a:.03+Math.random()*.05,spd:.3+Math.random()*.6}));

/* ── PLAYER ── */
let star={x:STAR_X,y:GY-STAR_R,vy:0,rot:0,grounded:true,jumps:0};
let jumpHeld=false,starSX=1,starSY=1,wasGrounded=true;

/* ── GAME STATE ── */
let obstacles=[],nextObs=80,particles=[],state='idle';
let score=0,hi=0,last=0,speed=BASE_SPD,elapsed=0,flashTimer=0,trail=[];

/* ─── INPUT ─── */
function tryJump(){
  if(state==='idle'){startGame();return;}
  if(state==='dead'){startGame();return;}
  if(star.jumps<2){
    star.vy=star.jumps===0?JUMP_V:DBLJ_V;
    star.grounded=false;star.jumps++;
    starSX=0.65;starSY=1.48; // stretch on jump
    spawnJumpPfx();jumpHeld=true;
  }
}
function releaseJump(){jumpHeld=false;}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tryJump();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')releaseJump();});
canvas.addEventListener('touchstart',e=>{e.preventDefault();tryJump();},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();releaseJump();},{passive:false});
canvas.addEventListener('mousedown',tryJump);
canvas.addEventListener('mouseup',releaseJump);

/* ─── START ─── */
function startGame(){
  state='running';score=0;speed=BASE_SPD;elapsed=0;
  star={x:STAR_X,y:GY-STAR_R,vy:0,rot:0,grounded:true,jumps:0};
  starSX=1;starSY=1;wasGrounded=true;
  obstacles=[];particles=[];trail=[];nextObs=obsGap();flashTimer=0;
  promptEl.style.opacity='0';statusMsg.textContent='Orbit maintained.';
}

function obsGap(){
  const base=85-Math.floor(elapsed/320)*5;
  return Math.max(Math.floor(base+Math.random()*88),38);
}

/* ─── OBSTACLE SPAWNER (progressive tiers) ─── */
function spawnObs(){
  const tier=score<100?0:score<220?1:2;
  const r=Math.random();
  let variant,w,h;
  if(tier===0){
    if(r<.50){variant='rock';w=20+r*38;h=15+Math.random()*20;}
    else if(r<.78){variant='pillar';w=10+Math.random()*9;h=26+Math.random()*26;}
    else{variant='cluster';w=32+Math.random()*24;h=13+Math.random()*13;}
  } else if(tier===1){
    if(r<.32){variant='rock';w=26+Math.random()*26;h=22+Math.random()*26;}
    else if(r<.58){variant='pillar';w=12+Math.random()*10;h=34+Math.random()*30;}
    else if(r<.78){variant='cluster';w=38+Math.random()*28;h=18+Math.random()*15;}
    else{variant='double';w=18+Math.random()*14;h=44+Math.random()*18;}
  } else {
    if(r<.28){variant='rock';w=30+Math.random()*28;h=28+Math.random()*28;}
    else if(r<.52){variant='pillar';w=14+Math.random()*12;h=44+Math.random()*32;}
    else if(r<.72){variant='double';w=20+Math.random()*16;h=50+Math.random()*20;}
    else{variant='cluster';w=46+Math.random()*30;h=22+Math.random()*18;}
  }
  obstacles.push({x:CW+30,variant,w,h,scored:false});
}

/* ─── PARTICLES ─── */
function spawnJumpPfx(){
  for(let i=0;i<8;i++){
    const a=Math.PI+(Math.random()-.5)*1.2;
    particles.push({x:star.x,y:star.y+STAR_R*.7,vx:Math.cos(a)*(1+Math.random()*3),vy:Math.sin(a)*(1+Math.random()*3)-.5,life:1,decay:.06+Math.random()*.04,r:.8+Math.random()*1.8,col:'rgba(255,255,255,1)',type:'d'});
  }
}
function spawnLandPfx(){
  for(let i=0;i<6;i++){
    particles.push({x:star.x+(Math.random()-.5)*STAR_R,y:star.y+STAR_R,vx:(Math.random()-.5)*3,vy:-(Math.random()*2.2),life:1,decay:.07+Math.random()*.05,r:.7+Math.random()*1.5,col:'rgba(200,196,228,1)',type:'d'});
  }
}
function spawnDeathPfx(){
  const cols=['#D93020','#FF6654','#E8B000','#FF9944','#FF4433'];
  for(let i=0;i<28;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*7;
    particles.push({x:star.x,y:star.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:.02+Math.random()*.03,r:2+Math.random()*4,col:cols[Math.floor(Math.random()*cols.length)],type:'s'});
  }
}
function spawnScorePfx(x,y){
  for(let i=0;i<5;i++){
    particles.push({x,y,vx:(Math.random()-.5)*2,vy:-1-Math.random()*2.5,life:1,decay:.06,r:1,col:'rgba(255,255,255,.75)',type:'d'});
  }
}

/* ─── DRAW HELPERS ─── */

/* Shared jagged rock path */
function rockPath(w,h){
  ctx.beginPath();
  const pts=[[.15,1],[0,.5],[.05,.17],[.22,.03],[.44,0],[.64,0],[.83,.05],[.97,.26],[1,.54],[.93,.82],[.76,1]];
  pts.forEach(([px,py],i)=>i===0?ctx.moveTo(px*w,py*h):ctx.lineTo(px*w,py*h));
  ctx.closePath();
}

/* Red paper star with squash-stretch */
function drawStar(x,y,r,rot,sx,sy){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,sy);
  ctx.shadowColor='rgba(217,48,32,.85)';ctx.shadowBlur=8+sy*9;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=(i*Math.PI/5)-Math.PI/2,rad=i%2===0?r:r*.42;
    i===0?ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
  }
  ctx.closePath();
  const rg=ctx.createRadialGradient(0,-r*.3,1,0,0,r);
  rg.addColorStop(0,'#FF7060');rg.addColorStop(.5,'#D93020');rg.addColorStop(1,'#7A1208');
  ctx.fillStyle=rg;ctx.fill();
  ctx.save();ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=.65;
  for(let xi=-r;xi<r;xi+=2.5){ctx.beginPath();ctx.moveTo(xi,-r);ctx.lineTo(xi+2.5,r);ctx.stroke();}
  ctx.restore();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=.9;ctx.stroke();
  ctx.beginPath();ctx.arc(-r*.18,-r*.3,r*.16,0,Math.PI*2);
  ctx.fillStyle='rgba(255,180,160,.42)';ctx.fill();
  ctx.restore();
}

const obsImgs = {
  rock: new Image(),
  pillar: new Image(),
  cluster: new Image(),
  double: new Image()
};
obsImgs.rock.src = 'assets/rocks/rock.svg';
obsImgs.pillar.src = 'assets/rocks/double.svg'; // Reuse double for pillar if not provided
obsImgs.cluster.src = 'assets/rocks/cluster.svg';
obsImgs.double.src = 'assets/rocks/double.svg';

function drawRock(x,y,w,h){
  if(obsImgs.rock.complete) ctx.drawImage(obsImgs.rock, x, y, w, h);
}
function drawPillar(x,y,w,h){
  if(obsImgs.pillar.complete) ctx.drawImage(obsImgs.pillar, x, y, w, h);
}
function drawCluster(x,y,w,h){
  if(obsImgs.cluster.complete) ctx.drawImage(obsImgs.cluster, x, y, w, h);
}
function drawDouble(x,y,w,h){
  if(obsImgs.double.complete) ctx.drawImage(obsImgs.double, x, y, w, h);
  if(score<130){
    ctx.save();
    const hint=Math.min(1,(130-score)/50);
    ctx.font=`500 5.5px "General Sans",sans-serif`;
    ctx.fillStyle=`rgba(255,255,255,${hint*.3})`;ctx.textAlign='center';
    ctx.fillText('↑↑',x+w/2,y-7);
    ctx.restore();
  }
}

/* ─── HIT TEST ─── */
function hitTest(){
  const HR=STAR_R*.58;
  for(const o of obstacles){
    const t=GY-o.h,l=o.x,r=o.x+o.w;
    const nx=Math.max(l,Math.min(star.x,r)),ny=Math.max(t,Math.min(star.y,GY));
    if(Math.hypot(star.x-nx,star.y-ny)<HR)return true;
  }
  return false;
}

/* ─── UPDATE ─── */
function update(){
  if(state!=='running')return;
  elapsed++;
  speed=Math.min(MAX_SPD,BASE_SPD+elapsed*SPD_INC);
  score=Math.floor(elapsed/5);
  scoreDisp.textContent=score;
  // trail
  trail.unshift({x:star.x,y:star.y,life:1});
  if(trail.length>20)trail.pop();
  trail.forEach(p=>p.life-=.055);
  // physics
  const g=jumpHeld&&star.vy<0?GRAVITY*.6:GRAVITY;
  star.vy+=g;star.y+=star.vy;
  if(star.y>=GY-STAR_R){
    if(!wasGrounded){spawnLandPfx();starSX=1.52;starSY=0.58;}
    star.y=GY-STAR_R;star.vy=0;star.grounded=true;star.jumps=0;
  } else star.grounded=false;
  if(star.y<CEIL_Y){star.y=CEIL_Y;star.vy=Math.max(star.vy,0);}
  wasGrounded=star.grounded;
  // spring back squash-stretch
  starSX+=(1-starSX)*.2;starSY+=(1-starSY)*.2;
  star.rot+=star.grounded?.022:.1;

  // obstacles
  nextObs--;
  if(nextObs<=0){spawnObs();nextObs=obsGap();}
  for(const o of obstacles){o.x-=speed;if(!o.scored&&o.x+o.w<star.x){o.scored=true;spawnScorePfx(star.x,star.y-STAR_R);}}
  obstacles=obstacles.filter(o=>o.x+o.w>-40);
  if(hitTest())die();
  // bg parallax
  BG_STARS.forEach(s=>{s.x-=s.speed;if(s.x<0)s.x=CW;s.twinkle+=s.twinkleSpd;});
  GDUST.forEach(d=>{d.x-=d.spd;if(d.x+d.w<0)d.x=CW+d.w;});
  SHOOTS.forEach(s=>{
    if(s.delay>0){s.delay--;return;}
    if(!s.active){s.active=true;s.life=0;}
    s.x+=s.vx;s.y+=s.vy;s.life++;
    if(s.life<8)s.alpha=s.life/8;
    else if(s.x<-70||s.y>GY+10)mkShoot(s);
    else s.alpha=Math.max(0,s.alpha-.016);
  });
  // particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.11;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
  if(flashTimer>0)flashTimer--;
}

function die(){
  state='dead';last=score;if(score>hi)hi=score;
  hiDisp.textContent=hi;lastDisp.textContent=last;
  spawnDeathPfx();flashTimer=14;
  promptEl.style.opacity='1';
  promptEl.innerHTML='<span>Space</span> / tap to re-launch';
  statusMsg.textContent='Signal lost.';
}

/* ─── DRAW ─── */
function draw(){
  if(flashTimer>0&&flashTimer%2===0){ctx.fillStyle='rgba(217,48,32,.13)';ctx.fillRect(0,0,CW,CH);return;}
  ctx.clearRect(0,0,CW,CH);
  // deep black sky
  ctx.fillStyle='#050407';ctx.fillRect(0,0,CW,GY);
  // subtle grey fog wisps (very faint)
  [{x:CW*.08,y:GY*.28,r:70,a:.022},{x:CW*.6,y:GY*.42,r:55,a:.018},{x:CW*.88,y:GY*.2,r:45,a:.02}].forEach(n=>{
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,`rgba(180,175,200,${n.a})`);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
  });
  // twinkling white stars
  BG_STARS.forEach(s=>{
    const a=.25+.75*(0.5+0.5*Math.sin(s.twinkle));
    if(s.isCross){
      const cs=s.r+.6;
      ctx.strokeStyle=`rgba(255,255,255,${a*.55})`;ctx.lineWidth=.5;
      ctx.beginPath();ctx.moveTo(s.x-cs,s.y);ctx.lineTo(s.x+cs,s.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s.x,s.y-cs);ctx.lineTo(s.x,s.y+cs);ctx.stroke();
    }
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
  });
  // shooting stars
  SHOOTS.forEach(s=>{
    if(!s.active||s.alpha<=0||s.delay>0)return;
    const spd=Math.hypot(s.vx,s.vy);
    const tx=s.x-s.vx*(s.len/spd),ty=s.y-s.vy*(s.len/spd);
    const sg=ctx.createLinearGradient(tx,ty,s.x,s.y);
    sg.addColorStop(0,'transparent');sg.addColorStop(1,`rgba(255,255,255,${s.alpha*.88})`);
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);
    ctx.strokeStyle=sg;ctx.lineWidth=1.3;ctx.stroke();
    ctx.beginPath();ctx.arc(s.x,s.y,.9,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.alpha})`;ctx.fill();
  });
  // planet

  // ground
  ctx.fillStyle='#0A0814';ctx.fillRect(0,GY,CW,CH-GY);
  GDUST.forEach(d=>{ctx.fillStyle=`rgba(255,255,255,${d.a})`;ctx.fillRect(d.x,GY+3,d.w,d.h);});
  ctx.save();ctx.shadowColor='rgba(255,255,255,.45)';ctx.shadowBlur=5;
  ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(0,GY,CW,1.5);
  ctx.restore();
  // obstacles
  obstacles.forEach(o=>{
    const oy=GY-o.h;
    if(o.variant==='rock')drawRock(o.x,oy,o.w,o.h);
    else if(o.variant==='pillar')drawPillar(o.x,oy,o.w,o.h);
    else if(o.variant==='cluster')drawCluster(o.x,oy,o.w,o.h);
    else drawDouble(o.x,oy,o.w,o.h);
  });
  // particles
  particles.forEach(p=>{
    ctx.save();
    if(!p.col.includes('rgba'))ctx.globalAlpha=Math.max(0,p.life*.88);
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.r*p.life),0,Math.PI*2);
    ctx.fillStyle=p.col;ctx.fill();
    ctx.restore();
  });
  // trail
  trail.forEach((pt,i)=>{
    if(pt.life<=0)return;
    const sz=STAR_R*.52*pt.life;
    ctx.save();ctx.globalAlpha=pt.life*.25;ctx.translate(pt.x,pt.y);ctx.rotate(star.rot-(i*.05));
    ctx.beginPath();
    for(let si=0;si<10;si++){
      const a=(si*Math.PI/5)-Math.PI/2,rd=si%2===0?sz:sz*.42;
      si===0?ctx.moveTo(Math.cos(a)*rd,Math.sin(a)*rd):ctx.lineTo(Math.cos(a)*rd,Math.sin(a)*rd);
    }
    ctx.closePath();
    // warm-to-cool colour shift along trail
    const hue=i<7?8:i<14?25:42;
    ctx.fillStyle=`hsl(${hue},75%,68%)`;ctx.fill();
    ctx.restore();
  });
  // player star
  if(state==='idle'){
    const bob=Math.sin(Date.now()*.0028)*4;
    drawStar(STAR_X,GY-STAR_R+bob,STAR_R,Date.now()*.0012,1,1);
    ctx.fillStyle='rgba(255,255,255,.07)';
    ctx.beginPath();ctx.ellipse(STAR_X,GY+4,14,3,0,0,Math.PI*2);ctx.fill();
  } else {
    const shadowDepth=Math.max(0,(GY-STAR_R-star.y)/(GY-STAR_R-CEIL_Y+1));
    ctx.fillStyle=`rgba(217,48,32,${.1*(1-shadowDepth*.65)})`;
    ctx.beginPath();ctx.ellipse(star.x,GY+4,14*starSX,2.5,0,0,Math.PI*2);ctx.fill();
    drawStar(star.x,star.y,STAR_R,star.rot,starSX,starSY);
  }
  // speed lines at max speed
  if(speed>10){
    const la=(speed-10)/(MAX_SPD-10)*.045;
    ctx.strokeStyle=`rgba(255,255,255,${la})`;ctx.lineWidth=.5;
    for(let li=0;li<8;li++){
      const ly2=15+Math.random()*(GY-30),lw2=35+Math.random()*75;
      ctx.beginPath();ctx.moveTo(Math.random()*CW,ly2);ctx.lineTo(Math.random()*CW-lw2,ly2);ctx.stroke();
    }
  }
}

(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
