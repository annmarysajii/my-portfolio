*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html{scroll-behavior:smooth;}

}

[data-theme="dark"]{
  --ink:#F2EFEB;--ink-deep:#F2EFEB;--ink5:rgba(242,239,235,.72);--ink12:rgba(242,239,235,.15);--ink07:rgba(242,239,235,.08);
  --bg:#0E0D13;--paper:#0E0D13;--surf:#1A1826;--white:#14131D;
  --blue:#7098F8;--red:#F05040;--yel:#F2C030;
}

    linear-gradient(to bottom, rgba(242, 239, 235, 0.035) 1px, transparent 1px);

  color:var(--ink)!important;
}

body{
  font-family:var(--fb);color:var(--ink);font-size:16px;line-height:1.6;
  background-color:var(--bg);

    linear-gradient(to right, rgba(44, 42, 41, 0.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(44, 42, 41, 0.045) 1px, transparent 1px);

}

body::before{

}

[data-theme="dark"] body::before{

}

a{color:inherit;text-decoration:none;}

img{display:block;max-width:100%;}



/* CURSOR & CANVAS */

body, a, button, input, textarea, select { cursor: none !important; }

<script>

// CURSOR & MOUSE TRACKING
let mx = -9999, my = -9999, cx = -9999, cy = -9999;
(function() {
  const cur = document.getElementById('star-cursor');
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  if (cur && isTouch) cur.style.display = 'none';

  // Direct position assignment — NO lerp, NO rAF interpolation, NO CSS transition on left/top
  window.addEventListener('mousemove', (e) => {
    mx = cx = e.clientX;
    my = cy = e.clientY;
    if (cur && !isTouch) {
      cur.style.left = mx + 'px';
      cur.style.top  = my + 'px';
    }
  }, { passive: true });

  // Scale on hover over interactive elements
  const hoverSel = 'a, button, .card, .gallery-img, .back-btn, .portfolio-btn, .track-card-btn, .orbit-item, .slider-track, #vinyl-disc, .filter-dial, .speed-btn, input, textarea, [role="button"]';
  document.addEventListener('mouseover', (e) => {
    if (cur && !isTouch && e.target.closest(hoverSel)) {
      cur.style.transform = 'translate(-50%,-50%) scale(1.25)';
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (cur && !isTouch && e.target.closest(hoverSel)) {
      cur.style.transform = 'translate(-50%,-50%) scale(1)';
    }
  });

  // Hide when cursor leaves the browser window
  document.addEventListener('mouseleave', () => { if (cur) cur.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { if (cur) cur.style.opacity = '1'; });
})();



// CANVAS STARS

const bgC=document.getElementById('bg-c');

if(bgC){

  const bgX=bgC.getContext('2d');

  let bW,bH;

  const HUES=[0,210,45];

  function rsz(){bW=bgC.width=innerWidth;bH=bgC.height=innerHeight;}

  window.addEventListener('resize',rsz);rsz();



  function drawStar(ctx,x,y,r,rot,color){

    ctx.save();ctx.translate(x,y);ctx.rotate(rot);

    ctx.beginPath();

    for(let i=0;i<10;i++){

      const a=(i*Math.PI/5)-Math.PI/2;

      const rad=i%2===0 ? r : r*.42;

      i===0 ? ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);

    }

    ctx.closePath();

    ctx.fillStyle=color;ctx.fill();

    ctx.restore();

  }



  const STARS=Array.from({length:45},()=>({

    x:Math.random()*window.innerWidth,

    y:Math.random()*window.innerHeight,

    r:2.5+Math.random()*5,

    speed:.35+Math.random()*.55,

    drift:(Math.random()-.5)*.28,

    rot:Math.random()*Math.PI*2,

    spin:(Math.random()-.5)*.018,

    alpha:.08+Math.random()*.1,

    hue:HUES[Math.floor(Math.random()*3)],

    lit:0

  }));



  function bgFrame(){

    bgX.clearRect(0,0,bW,bH);

    STARS.forEach(s=>{

      s.y+=s.speed;s.x+=s.drift;s.rot+=s.spin;

      if(s.y>bH+20){s.y=-20;s.x=Math.random()*bW;}



      const dist=Math.hypot(cx-s.x,cy-s.y);

      const prox=Math.max(0,1-dist/110);

      s.lit=Math.max(s.lit*.94,prox);



      const sz=s.r+(s.lit*6.5);

      const a=s.alpha+(s.lit*.6);

      const color=s.lit>.04

        ?`hsla(${s.hue},88%,52%,${a})`

        :`rgba(17,16,9,${s.alpha})`;



      drawStar(bgX,s.x,s.y,sz,s.rot,color);

    });

    requestAnimationFrame(bgFrame);

  }

  bgFrame();

}



(function initTheme() {

  document.documentElement.setAttribute('data-theme', saved);
  const icon = document.getElementById('themeIcon');
  if (icon) {
    icon.setAttribute('data-lucide', saved === 'dark' ? 'sun' : 'moon');
  }
})();

window.toggleTheme = function() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);

  // Clear hardcoded inline theme overrides on html element so CSS takes full effect
  const el = document.documentElement;
  if (next === 'dark') {
    el.style.removeProperty('--bg');
    el.style.removeProperty('--surf');
    el.style.removeProperty('--ink');
    el.style.removeProperty('--white');
    el.style.removeProperty('--line');
  } else {
    // Re-apply project-specific light colors if applicable
    const params = new URLSearchParams(window.location.search);
    const pId = params.get('id');
    if (pId === 'gobunny') {
      el.style.setProperty('--bg', '#FFF2F0');
      el.style.setProperty('--surf', '#FFFFFF');
      el.style.setProperty('--ink', '#FF3522');
      el.style.setProperty('--line', 'rgba(255, 53, 34, 0.2)');
    } else if (pId === 'green-arrow') {
      el.style.setProperty('--bg', '#EBF4ED');
      el.style.setProperty('--surf', '#F4F9F5');
      el.style.setProperty('--ink', '#2B5E39');
      el.style.setProperty('--line', 'rgba(43, 94, 57, 0.2)');
    }
  }

  const icon = document.getElementById('themeIcon');
  if (icon) {
    icon.setAttribute('data-lucide', next === 'dark' ? 'sun' : 'moon');
    if (window.lucide) window.lucide.createIcons();
  }
};



window.toggleMusic=function(){

  const m=document.getElementById('bg-music');

  const b=document.getElementById('musicBtn');

  if(m.paused){

    m.play().catch(e=>console.log('Music play prevented:',e));

    if(b) b.classList.toggle('on', !m.paused);
      const mIcon = b.querySelector('.icon');
      if(mIcon) {
        mIcon.setAttribute('data-lucide', m.paused ? 'music' : 'volume-2');
        if(window.lucide) window.lucide.createIcons();
      }

  } else {

    m.pause();

    if(b) b.classList.toggle('on', !m.paused);
      const mIcon = b.querySelector('.icon');
      if(mIcon) {
        mIcon.setAttribute('data-lucide', m.paused ? 'music' : 'volume-2');
        if(window.lucide) window.lucide.createIcons();
      }

  }

};

      let rawName = str.split('/').pop().replace(/\.[^/.]+$/, "");
      const overrides = {
          'GO BUNNY': 'Primary Logo Lockup',
          'Your paragraph text (33)': 'Brand Pattern',
          'Your paragraph text (35)': 'Badge Logo',

          'Copy of ART DIRECTION PORTFOLIO (3)': 'Cider Beverage Cans',
          'LOGO GREEN ARROW': 'Primary Lockup',
          'EcoFuture Color Pallette': 'Color Palette',
          'GLOW SQUARE poster': 'Campaign Square Poster',
          'GLOW Web Ad Square (300 x 250 px)': 'Digital Web Campaign Ad',
          'GLOW PRESENTATION Backdrop (1)': 'Presentation Stage Backdrop',
          'GLOW PPT SLIDE': 'Presentation Slide Deck',
          'ntu banner': 'NTU Campus Web Banner',
          'wssbanner': 'WSS Event Web Banner'
      };
      if (overrides[rawName]) return overrides[rawName];
      let name = rawName.replace(/[-_]/g, ' ').replace(/\s*\(\d+\)\s*/g, ' ').trim();
      return name.charAt(0).toUpperCase() + name.slice(1);
  }

                    ctx.strokeStyle = kickPunch > 0.2 ? `rgba(245, 255, 250, ${0.4 + kickPunch * 0.5})` : `rgba(0, 255, 102, ${0.25 + smoothBass * 0.45})`;
                    ctx.lineWidth = 2.0 + kickPunch * 1.5;
                    ctx.stroke();
                    ctx.restore();
                    
                    // 5. TRANSIENT LASER HORIZON BEAM ON BEAT DROPS
                    if (kickPunch > 0.05 && activeGain > 0) {
                      ctx.save();
                      // Intense Core Laser Line
                      ctx.strokeStyle = `rgba(255, 255, 255, ${kickPunch * 0.85})`;
                      ctx.lineWidth = 2.0;
                      ctx.beginPath();
                      ctx.moveTo(0, horizonY);
                      ctx.lineTo(W, horizonY);
                      ctx.stroke();
                      
                      // Volumetric Laser Haze
                      const laserHaze = ctx.createLinearGradient(0, horizonY - 40 * kickPunch, 0, horizonY + 40 * kickPunch);
                      laserHaze.addColorStop(0, 'rgba(0, 255, 102, 0)');
                      laserHaze.addColorStop(0.5, `rgba(0, 255, 102, ${kickPunch * 0.35})`);
                      laserHaze.addColorStop(1, 'rgba(0, 255, 102, 0)');
                      ctx.fillStyle = laserHaze;
                      ctx.fillRect(0, horizonY - 40 * kickPunch, W, 80 * kickPunch);
                      ctx.restore();
                    }
                    
                    // 6. ATMOSPHERIC HI-HAT STARDUST PARTICLES (Warehouse Smoke Glitter)
                    if (cloudyDots && isPlaying && activeGain > 0) {
                      ctx.save();
                      const trebleSpark = Math.max(0, smoothTreble);
                      for (let i = 0; i < 40; i++) {
                        const pt = cloudyDots[i];
                        const px = (pt.xRel * W + cTime * 25) % W;
                        const py = pt.yRel * H;
                        const pAlpha = (pt.baseAlpha * 0.4 + trebleSpark * 0.6) * activeGain;
                        const pSize = 1.0 + (trebleSpark * 2.0);
                        
                        ctx.fillStyle = (i % 3 === 0) ? `rgba(235, 255, 245, ${pAlpha})` : `rgba(0, 255, 102, ${pAlpha})`;
                        ctx.beginPath();
                        ctx.arc(px, py, pSize, 0, Math.PI * 2);
                        ctx.fill();
                      }
                      ctx.restore();
                    }
                    
                    // 7. SUBTLE HARDWARE TELEMETRY BADGES
                    ctx.font = '600 9px "SF Mono", "Fira Code", monospace';
                    ctx.fillStyle = 'rgba(0, 255, 102, 0.40)';
                    ctx.textAlign = 'left';
                    ctx.fillText(`128 BPM // ACID RAVE MATRIX // PEAK: ${Math.round(smoothBass * 100)}%`, W * 0.05, H * 0.94);
                    
                    // 8. CINEMATIC STAGE VIGNETTE
                    const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.85);
                    vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    vignette.addColorStop(1, 'rgba(1, 3, 2, 0.85)');
                    ctx.fillStyle = vignette;
                    ctx.fillRect(0, 0, W, H);
                  }

                  else if (track.genre === 'experimental') {
                    // 1. Render Synchronized Cloudy Days Music Video (Pure & Clean)
                    if (bgVideo && bgVideo.readyState >= 2) {
                      const vW = bgVideo.videoWidth || 1280;
                      const vH = bgVideo.videoHeight || 720;
                      const scale = Math.max(W / vW, H / vH);
                      const sW = vW * scale;
                      const sH = vH * scale;
                      const sX = (W - sW) / 2;
                      const sY = (H - sH) / 2;
                      ctx.drawImage(bgVideo, sX, sY, sW, sH);
                    } else {
                      ctx.fillStyle = '#080B10';
                      ctx.fillRect(0, 0, W, H);
                    }
                    
                    // 2. Cinematic Soft Stage Vignette (Clean contrast for deck)
                    const expVignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.85);
                    expVignette.addColorStop(0, 'rgba(8, 11, 16, 0.15)');
                    expVignette.addColorStop(1, 'rgba(3, 5, 8, 0.80)');
                    ctx.fillStyle = expVignette;
                    ctx.fillRect(0, 0, W, H);
                  }
                  
                  // ================================================================
                  // 3. PARADISE — UNIVERSE VISUALIZER WITH STARS & CONSTELLATIONS
                  // ================================================================
                  else if (track.genre === 'pop') {
                    // 1. Render Synchronized Paradise Music Video (Pure & Clean)
                    if (bgVideo && bgVideo.readyState >= 2) {
                      const vW = bgVideo.videoWidth || 1280;
                      const vH = bgVideo.videoHeight || 720;
                      const scale = Math.max(W / vW, H / vH);
                      const sW = vW * scale;
                      const sH = vH * scale;
                      const sX = (W - sW) / 2;
                      const sY = (H - sH) / 2;
                      ctx.drawImage(bgVideo, sX, sY, sW, sH);
                    } else {
                      ctx.fillStyle = '#0B0512';
                      ctx.fillRect(0, 0, W, H);
                    }
                    
                    // 2. Cinematic Wong Kar-wai Warm Dark Vignette
                    const popVignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.85);
                    popVignette.addColorStop(0, 'rgba(15, 6, 22, 0.15)');
                    popVignette.addColorStop(1, 'rgba(4, 2, 7, 0.80)');
                    ctx.fillStyle = popVignette;
                    ctx.fillRect(0, 0, W, H);
                  }

                  requestAnimationFrame(drawViz);
                }
                
                requestAnimationFrame(drawViz);
              }
              
                            // Keyboard Spacebar Play/Pause, Volume, and Skip Controls
              window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') {
                  e.preventDefault();
                  const activeBtn = document.getElementById(`tbtn-${currentIdx}`);
                  if (activeBtn) activeBtn.click();
                } else if (e.code === 'ArrowUp') {
                  e.preventDefault();
                  const newVol = Math.min(1.0, audio.volume + 0.1);
                  audio.volume = newVol;
                  if (bgVideo) { bgVideo.volume = newVol; bgVideo.muted = false; }
                  audio.muted = false;
                  if (volKnob && volSlider) volKnob.style.top = `${(1 - newVol) * volSlider.clientHeight}px`;
                } else if (e.code === 'ArrowDown') {
                  e.preventDefault();
                  const newVol = Math.max(0.0, audio.volume - 0.1);
                  audio.volume = newVol;
                  if (bgVideo) bgVideo.volume = newVol;
                  if (volKnob && volSlider) volKnob.style.top = `${(1 - newVol) * volSlider.clientHeight}px`;
                } else if (e.code === 'ArrowLeft') {
                  e.preventDefault();
                  const med = getActiveMedia();
                  if (med && med.duration) {
                    med.currentTime = Math.max(0, med.currentTime - 5);
                  }
                } else if (e.code === 'ArrowRight') {
                  e.preventDefault();
                  const med = getActiveMedia();
                  if (med && med.duration) {
                    med.currentTime = Math.min(med.duration, med.currentTime + 5);
                  }
                }
              });
              startVizLoop();
              return;
          }

          // 9. JASMINE CONCEPT ALBUM

          if (id === 'jasmine-album') {
              const imgs = media.filter(f => f.match(/\/\d\.(png|jpe?g)$/i)).sort();
              const audios = media.filter(f => f.match(/\.(wav|mp3|m4a)$/i));
              
              let albumHtml = styleBlock + `
              <div class="jasmine-multimedia-banner" style="margin-top: 1rem; margin-bottom: 3rem; padding: 2.25rem 2rem; background: linear-gradient(135deg, #161226, #281B45); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; color: #fff; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
                <div>
                  <div style="font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:#A78BFA; font-weight:700; margin-bottom:0.4rem; display:flex; align-items:center; gap:6px;">
                    <i data-lucide="sparkles" style="width:14px; height:14px;"></i> Capstone Multimedia Experience
                  </div>
                  <h3 style="font-family:'Clash Display', sans-serif; font-size:1.75rem; margin:0 0 0.5rem 0; color:#fff; font-weight:700;">Launch Interactive Screenplay & Music Reader</h3>
                  <p style="color:rgba(255,255,255,0.75); margin:0; font-size:0.95rem; max-width:560px; line-height:1.5;">Experience the synchronized audio-visual web reader where original orchestral tracks, script dialog, and chapter illustrations play together in real-time.</p>
                </div>
                <a href="jasmine_reader.html" class="interactive-launch-btn" style="padding:0.9rem 1.8rem; background:#FAF8F4; color:#111; font-weight:700; border-radius:30px; text-decoration:none; display:inline-flex; align-items:center; gap:0.6rem; font-family:'General Sans', sans-serif; font-size:0.95rem; transition:transform 0.2s, box-shadow 0.2s; box-shadow:0 8px 20px rgba(0,0,0,0.25);">
                  <span>Launch Experience</span>
                  <i data-lucide="arrow-up-right" style="width:16px; height:16px;"></i>
                </a>
              </div>
` + '<style>.album-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:2rem;}</style><div class="album-grid">';
              const count = Math.min(imgs.length, audios.length);
              for(let i=0; i<count; i++) {
                  let img = imgs[i] ? `<img src="${imgs[i]}" alt="Track ${i+1}" style="width:100%; height:auto; border-radius:6px 6px 0 0; display:block;">` : '';

                  albumHtml += `<div style="background:var(--surf); border:1px solid var(--line); border-radius:6px; overflow:hidden;">
                      ${img}

              }
              albumHtml += '</div>';
              gal.innerHTML = albumHtml;
              // Kick off visualizer loop immediately for ambient background

              window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') {
                  e.preventDefault();

                  if (activeBtn) activeBtn.click();

                  e.preventDefault();
                  const newVol = Math.min(1.0, audio.volume + 0.1);
                  audio.volume = newVol;
                  if (bgVideo) { bgVideo.volume = newVol; bgVideo.muted = false; }
                  audio.muted = false;
                  if (volKnob && volSlider) volKnob.style.top = `${(1 - newVol) * volSlider.clientHeight}px`;

                  audio.volume = newVol;
                  if (bgVideo) bgVideo.volume = newVol;
                  if (volKnob && volSlider) volKnob.style.top = `${(1 - newVol) * volSlider.clientHeight}px`;
                } else if (e.code === 'ArrowLeft') {
                  e.preventDefault();

                  if (med && med.duration) {

              startVizLoop();

              return;
          }

          // 10. DEFAULT / ALL OTHER GALLERIES
          const isComic = id === 'wellbeing-planner' || id === 'jasmine-comic';
          let htmlStr = styleBlock + `<div class="${isComic ? 'comic-grid' : 'masonry-container'}">`;
          
          media.forEach((file) => {
              htmlStr += renderMedia(file, isComic);

          gal.innerHTML = htmlStr;
      }
