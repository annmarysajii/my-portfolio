<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html{scroll-behavior:smooth;}

:root{
  --ink:#181715;--ink-deep:#181715;--ink5:#5C5854;--ink12:rgba(24,23,21,.12);--ink07:rgba(24,23,21,.07);
  --bg:#F9F6F0;--paper:#F9F6F0;--surf:#EFE9DC;--white:#FFFDF8;
  --blue:#1850A8;--red:#D93020;--yel:#E8B000;
  --fd:'Clash Display',Georgia,serif;
  --fb:'General Sans',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);

  /* === STUDIO PLAYGROUND DESIGN TOKENS === */
  --brand-blue: #1E3FC4;
  --brand-red: #E8432E;
  --brand-yellow: #FFCC00;
  --accent-teal: #2BC9B5;
  --accent-pink: #FF5FA2;
  --accent-purple: #8B5CF6;
  --accent-orange: #FF8A3D;
  --pop-sh-sm: 2px 2px 0 var(--ink);
  --pop-sh: 3px 3px 0 var(--ink);
  --pop-sh-lg: 5px 5px 0 var(--ink);
  --pop-sh-hover: 4px 5px 0 var(--ink);
}

[data-theme="dark"]{
  --ink:#F2EFEB;--ink-deep:#F2EFEB;--ink5:rgba(242,239,235,.72);--ink12:rgba(242,239,235,.15);--ink07:rgba(242,239,235,.08);
  --bg:#0E0D13;--paper:#0E0D13;--surf:#1A1826;--white:#14131D;
  --blue:#7098F8;--red:#F05040;--yel:#F2C030;
  --brand-blue: #5C7CFA;
  --brand-red: #FF6B6B;
  --brand-yellow: #FFD43B;
  --accent-teal: #38D9A9;
  --accent-pink: #FF85C0;
  --accent-purple: #B197FC;
  --accent-orange: #FFA94D;
  --pop-sh-sm: 2px 2px 0 rgba(0,0,0,0.6);
  --pop-sh: 3px 3px 0 rgba(0,0,0,0.8);
  --pop-sh-lg: 5px 5px 0 rgba(0,0,0,0.9);
  --pop-sh-hover: 4px 5px 0 rgba(0,0,0,0.85);
}

[data-theme="dark"] body{
  background-image:
    linear-gradient(to right, rgba(242, 239, 235, 0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(242, 239, 235, 0.035) 1px, transparent 1px);
  background-color:var(--bg)!important;
  color:var(--ink)!important;
}
[data-theme="dark"] .nav.sc{background:rgba(14,13,19,.94)!important;}

body{
  font-family:var(--fb);color:var(--ink);font-size:16px;line-height:1.6;
  background-color:var(--bg);
  background-image:
    linear-gradient(to right, rgba(44, 42, 41, 0.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(44, 42, 41, 0.045) 1px, transparent 1px);
  background-size:24px 24px;
  cursor:none;
  transition:background-color .35s ease, color .35s ease;
}

body::before{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  background-image:url("assets/svg-opt/paper-light-tile.webp");
  background-size:900px 900px;
  opacity:0.38;mix-blend-mode:multiply;
}

[data-theme="dark"] body::before{
  background-image:url("assets/svg-opt/paper-dark-tile.webp");
  mix-blend-mode:screen;
  opacity:0.30;
}

a{color:inherit;text-decoration:none;}

img{display:block;max-width:100%;}



/* CURSOR & CANVAS */

#star-cursor {
  position: fixed;
  top: 0;
  left: 0;
  width: 32px;
  height: 32px;
  pointer-events: none;
  z-index: 999999;
  transform: translate(-50%, -50%);
  opacity: 0;
  visibility: hidden;
  transition: transform 0.12s cubic-bezier(0.2, 0, 0.2, 1);
  will-change: left, top, transform;
}

html.has-custom-cursor #star-cursor {
  opacity: 1 !important;
  visibility: visible !important;
}

#star-cursor img,
#star-cursor svg {
  width: 100%;
  height: 100%;
  display: block;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
}

@media (pointer: fine) {
  html.has-custom-cursor,
  html.has-custom-cursor body,
  html.has-custom-cursor a,
  html.has-custom-cursor button,
  html.has-custom-cursor input,
  html.has-custom-cursor textarea,
  html.has-custom-cursor select,
  html.has-custom-cursor .card,
  html.has-custom-cursor .gallery-img,
  html.has-custom-cursor .back-btn,
  html.has-custom-cursor .portfolio-btn,
  html.has-custom-cursor .track-card-btn {
    cursor: none !important;
  }
}

@media (pointer: coarse) {
  #star-cursor { display: none !important; }
  *, body, a, button, input, textarea, select { cursor: auto !important; }
}

#bg-c{position:fixed;inset:0;z-index:-1;pointer-events:none;}



/* NAV */

.nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:1.2rem 0;transition:background .3s,box-shadow .3s,padding .3s;}

.nav.sc{background:var(--bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--ink12);padding:.75rem 0;}

.nav-in{max-width:1200px;margin:0 auto;padding:0 clamp(1.5rem,5vw,4rem);display:flex;align-items:center;justify-content:space-between;gap:2rem;}

.nav-logo{font-family:var(--fd);font-size:.95rem;font-weight:700;}

/* Base pill-button chrome — the nav-bar and DJ-studio instances override these
   with their own inline styles, but the plain "Back to Portfolio" links at the
   bottom of every project page had none, so they rendered as bare text instead
   of a button like their siblings. This gives every .nav-back a real default. */
.nav-back{display:inline-flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600;color:var(--ink5);text-decoration:none;padding:0.45rem 1.0rem;border-radius:20px;background:var(--surf);border:1px solid var(--line);transition:all .2s;}

.nav-back:hover{color:var(--ink);border-color:var(--ink12);}

.nav-back svg{transition:transform .2s;}

.nav-back:hover svg{transform:translateX(-3px);}



/* MAIN LAYOUT */

.con{max-width:1200px;margin:0 auto;padding:0 clamp(1.5rem,5vw,4rem);}



/* PROJECT HEADER */

.proj-header{

  padding:calc(80px + 3rem) 0 3rem;

  border-bottom:1.5px dashed var(--ink12);

  margin-bottom:3rem;

}

.proj-disc-tag{

  display:inline-flex;align-items:center;gap:.5rem;

  font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;

  color:var(--blue);margin-bottom:1rem;

}

.proj-title{

  font-family:var(--fd);

  font-size:clamp(2.5rem,6vw,5.5rem);

  font-weight:700;line-height:.97;letter-spacing:-.03em;

  margin-bottom:1rem;

  color:var(--accent, var(--ink));

}

.proj-badge{

  display:inline-block;padding:.28rem .75rem;border-radius:2px;

  font-size:.8rem;font-weight:600;

  background:linear-gradient(135deg,var(--yel),#C08800);color:var(--ink);

  box-shadow:1px 2px 0 rgba(17,16,9,.15);

  margin-bottom:1.5rem;

}

.proj-meta-row{display:flex;align-items:center;gap:2rem;flex-wrap:wrap;}

.proj-meta-item{font-size:.875rem;color:var(--ink5);}

.proj-meta-item strong{color:var(--ink);font-weight:600;}

.proj-meta-sep{width:1px;height:16px;background:var(--ink12);}



/* MAIN GRID */

.proj-grid{

  display:grid;grid-template-columns:1fr 300px;gap:3.5rem;

  margin-bottom:4rem;

  align-items:start;

}

.proj-overview{font-size:1.05rem;line-height:1.8;color:var(--ink5);margin-bottom:1.5rem;}

.proj-overview strong{color:var(--ink);font-weight:600;}

.proj-process{

  padding:1.5rem;background:var(--white);border:1.5px solid var(--ink12);border-radius:2px;

}

.proc-h{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:.75rem;}

.proc-p{font-size:.9375rem;line-height:1.7;color:var(--ink5);}



/* SIDEBAR */

.proj-sidebar{display:flex;flex-direction:column;gap:1.2rem;}

.sidebar-block{padding:1.1rem 1.25rem;background:var(--white);border:1.5px solid var(--ink12);border-radius:2px;position:relative;}

.sidebar-block::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-1.2deg);width:42px;height:13px;background:rgba(232,176,0,.5);border-radius:1px;}

.sidebar-block:nth-child(even)::before{background:rgba(24,80,168,.2);transform:translateX(-50%) rotate(1deg);}

.sb-lbl{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink5);margin-bottom:.4rem;}

.sb-val{font-size:.9375rem;font-weight:500;color:var(--ink);line-height:1.5;}

.sb-val.small{font-size:.875rem;}

.tools-list{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.2rem;}

.tool-tag{font-size:.75rem;font-weight:500;padding:.1rem .5rem;background:var(--surf);border:1px solid var(--ink12);border-radius:2px;color:var(--ink5);}



/* IMAGE GALLERY */

.gallery-h{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink5);margin-bottom:1.25rem;}

.gallery-hero{

  background:var(--surf);border:1.5px solid var(--ink12);

  border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;

  gap:.75rem;margin-bottom:1rem;position:relative;overflow:hidden;

}

.gallery-hero::before{

  content:'';position:absolute;inset:0;

  background-image:radial-gradient(circle,rgba(17,16,9,.08) 1px,transparent 1px);

  background-size:18px 18px;

}

.ph-icon{font-size:2.2rem;position:relative;z-index:1;}

.ph-label{font-size:.875rem;color:var(--ink5);position:relative;z-index:1;text-align:center;padding:0 2rem;}

.gallery-row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}

.gallery-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:3rem;}

.gallery-img{

  background:var(--surf);border:1.5px solid var(--ink12);

  border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;

  gap:.5rem;position:relative;overflow:hidden;

  transition:transform .25s var(--ease),box-shadow .25s;

}

.gallery-img:hover{transform:translateY(-3px);box-shadow:3px 5px 0 rgba(17,16,9,.1),0 10px 24px rgba(17,16,9,.1);}

.gallery-img::before{

  content:'';position:absolute;inset:0;

  background-image:radial-gradient(circle,rgba(17,16,9,.07) 1px,transparent 1px);

  background-size:16px 16px;

}

.gallery-img .ph-icon{font-size:1.5rem;}

.gallery-img .ph-label{font-size:.75rem;padding:0 1rem;text-align:center;}

.gallery-img-sq{}



.tape{

  position:absolute;z-index:2;

  width:50px;height:14px;border-radius:1px;opacity:.7;

}

.tape-tl{top:-4px;left:1.5rem;background:rgba(232,176,0,.55);transform:rotate(-1.5deg);}

.tape-tr{top:-4px;right:1.5rem;background:rgba(24,80,168,.22);transform:rotate(1.2deg);}



/* BOTTOM NAV */

.proj-footer{

  border-top:1.5px dashed var(--ink12);

  padding:2.5rem 0;margin-top:1rem;

  display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap;

}

.back-btn{

  display:inline-flex;align-items:center;gap:.6rem;

  padding:.65rem 1.3rem;border:1.5px solid var(--ink12);border-radius:2px;

  font-size:.9rem;font-weight:600;background:var(--white);

  transition:border-color .2s,background .2s,transform .15s;

}

.back-btn:hover{border-color:var(--ink);background:var(--surf);transform:translateX(-3px);}

.portfolio-btn{

  display:inline-flex;align-items:center;gap:.5rem;

  padding:.65rem 1.3rem;background:var(--ink);color:var(--bg);border-radius:2px;

  font-size:.9rem;font-weight:600;border:1.5px solid var(--ink);

  transition:background .2s,transform .15s;

}

.portfolio-btn:hover{background:var(--blue);border-color:var(--blue);transform:translateX(3px);}



/* foot */

.foot{padding:1.5rem 0;background:var(--ink);color:rgba(250,248,244,.38);}

.foot-in{max-width:1200px;margin:0 auto;padding:0 clamp(1.5rem,5vw,4rem);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}

.foot-logo{font-family:var(--fd);font-size:.9rem;font-weight:700;color:var(--bg);}

.foot-copy{font-size:.8125rem;}



/* RESPONSIVE */

@media(max-width:800px){

  .proj-grid{grid-template-columns:1fr;}

  .proj-sidebar{flex-direction:row;flex-wrap:wrap;}

  .sidebar-block{flex:1;min-width:140px;}

  .gallery-row3{grid-template-columns:1fr 1fr;}

}

@media(max-width:500px){

  .gallery-row2{grid-template-columns:1fr;}

  .gallery-row3{grid-template-columns:1fr;}

}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}


@media (pointer: coarse), (hover: none), (max-width: 1024px) {
  #star-cursor { display: none !important; }
  body, button, a, input, textarea, select, canvas { cursor: auto !important; }
}


@keyframes lineBoil {
  0%, 100% { filter: url(#boil-1); }
  33.3%    { filter: url(#boil-2); }
  66.6%    { filter: url(#boil-3); }
}
.line-boil {
  animation: lineBoil 0.28s steps(1) infinite;
}


/* ================================================================
   PROJ-HERO-PLATE -- the optional featured image set by p.hero.
   Sits between the header and the first section, so the strongest
   single artefact is the first thing seen rather than the last.
   No border: the lift comes from the shadow, the way a print resting
   on a surface behaves. Caption is the only text allowed on it.
================================================================ */
.proj-hero-plate{
  margin:0 0 3.25rem;
}
.proj-hero-plate img{
  display:block; width:100%; height:auto;
  border-radius:10px; border:0;
  box-shadow:0 18px 44px -20px rgba(16,12,8,.55), 0 3px 10px -4px rgba(16,12,8,.35);
}
.proj-hero-plate figcaption{
  margin-top:.85rem; max-width:70ch;
  font-size:.9rem; line-height:1.6; color:var(--ink5);
}
@media (max-width:640px){
  .proj-hero-plate{ margin-bottom:2.25rem; }
  .proj-hero-plate img{ border-radius:8px; }
}

/* ================================================================
   PRODUCTION NOTES -- editorial replacement for the old post-it
   dossier. Takes the project page's own colour tokens (--ink,
   --accent, --line) so it stays coherent on every project's ground.
   No cards, no fake paper, no handwriting: the type carries it.
================================================================ */
.prod-notes {
  margin: clamp(3rem, 6vw, 4.5rem) 0 3rem;
}
.prod-notes-hd {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  margin: 0 0 clamp(1.4rem, 2.6vw, 2rem);
  font-family: var(--fb, system-ui, sans-serif);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--accent, var(--ink));
}
.prod-notes-hd::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line, rgba(0, 0, 0, 0.12));
}
.prod-notes-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(1.5rem, 3vw, 2.8rem);
  margin: 0;
  padding: 0;
  list-style: none;
}
.prod-note { margin: 0; min-width: 0; }
.prod-note-n {
  display: block;
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--accent, var(--ink));
  letter-spacing: 0.08em;
  margin: 0 0 0.55rem;
}
.prod-note-t {
  display: block;
  font-family: var(--fd, Georgia, serif);
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.25;
  color: var(--ink);
  letter-spacing: -0.005em;
  margin: 0 0 0.55rem;
}
.prod-note-d {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--ink);
  opacity: 0.78;
}
/* Small note counts get narrower, left-aligned tracks so a single note
   does not read as a broken grid. :has() has full Baseline support now. */
.prod-notes-list:has(> :nth-child(2):last-child) {
  grid-template-columns: repeat(2, minmax(0, 420px));
}
.prod-notes-list:has(> :first-child:last-child) {
  grid-template-columns: minmax(0, 520px);
}
@media (max-width: 900px) {
  .prod-notes-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .prod-notes-list { grid-template-columns: 1fr; gap: 1.5rem; }
  .prod-note + .prod-note {
    border-top: 1px solid var(--line, rgba(0, 0, 0, 0.1));
    padding-top: 1.5rem;
  }
}
</style>

<style>
/* === SKELETON SHIMMER STYLES === */
.card-img, .shimmer-wrap {
    position: relative;
    overflow: hidden;
    background: #EBE8E1 !important;
    min-height: 180px;
    border-radius: 4px;
}
[data-theme="dark"] .card-img, [data-theme="dark"] .shimmer-wrap {
    background: #14131D !important;
}

.card-img:not(.media-loaded)::before, .shimmer-wrap:not(.loaded)::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.4s infinite linear;
    z-index: 1;
    pointer-events: none;
}
[data-theme="dark"] .card-img:not(.media-loaded)::before, [data-theme="dark"] .shimmer-wrap:not(.loaded)::before {
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0) 100%);
}

@keyframes skeleton-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

.card-img img, .card-img video, .shimmer-wrap img, .shimmer-wrap video {
    opacity: 0;
    transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 2;
    width: 100%;
    height: auto;
    display: block;
}

.card-img.media-loaded img, .card-img.media-loaded video, .shimmer-wrap.loaded img, .shimmer-wrap.loaded video {
    opacity: 1 !important;
}
</style>
<style>
/* === GALLERY SHIMMER STYLES === */
.gallery-img {
    position: relative !important;
    overflow: hidden !important;
    background: #E8E5DD !important;
}
[data-theme="dark"] .gallery-img {
    background: #151420 !important;
}
.gallery-img:not(.media-loaded)::after {
    content: '' !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.7) 50%, transparent 100%) !important;
    background-size: 200% 100% !important;
    animation: shimmerWave 1.3s infinite ease-in-out !important;
    z-index: 5 !important;
    pointer-events: none !important;
}
[data-theme="dark"] .gallery-img:not(.media-loaded)::after {
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.12) 50%, transparent 100%) !important;

<script>

// CURSOR & MOUSE TRACKING
(function initProjectCustomCursor() {
  const cur = document.getElementById('star-cursor');
  if (!cur) return;

  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  if (isTouch) {
    cur.style.display = 'none';
    return;
  }

  let isOverInteractive = false;

  window.addEventListener('mousemove', (e) => {
    cur.style.left = e.clientX + 'px';
    cur.style.top  = e.clientY + 'px';

    if (!document.documentElement.classList.contains('has-custom-cursor')) {
      document.documentElement.classList.add('has-custom-cursor');
    }
  }, { passive: true });

  const hoverSel = 'a, button, .card, .gallery-img, .back-btn, .portfolio-btn, .track-card-btn, .orbit-item, .slider-track, #vinyl-disc, .filter-dial, .speed-btn, input, textarea, [role="button"], [role="link"], label';

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(hoverSel)) {
      isOverInteractive = true;
      cur.style.transform = 'translate(-50%, -50%) scale(1.35) rotate(12deg)';
    }
  }, { passive: true });

  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(hoverSel)) {
      isOverInteractive = false;
      cur.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';
    }
  }, { passive: true });

  window.addEventListener('mousedown', () => {
    cur.style.transform = 'translate(-50%, -50%) scale(0.85) rotate(-10deg)';
  }, { passive: true });

  window.addEventListener('mouseup', () => {
    cur.style.transform = isOverInteractive 
      ? 'translate(-50%, -50%) scale(1.35) rotate(12deg)'
      : 'translate(-50%, -50%) scale(1) rotate(0deg)';
  }, { passive: true });

  document.addEventListener('mouseleave', () => {
    document.documentElement.classList.remove('has-custom-cursor');
  });

  document.addEventListener('mouseenter', (e) => {
    cur.style.left = e.clientX + 'px';
    cur.style.top  = e.clientY + 'px';
    document.documentElement.classList.add('has-custom-cursor');
  });
})();

// CANVAS STARS

const bgC=document.getElementById('bg-c');

if(bgC){

  const bgX=bgC.getContext('2d');

  let bW,bH;

  const HUES=[0,210,45];

  function rsz(){bW=bgC.width=innerWidth;bH=bgC.height=innerHeight;}

  window.addEventListener('resize',rsz);rsz();



  function drawStar(ctx,x,y,r,rot,color){

    ctx.save();ctx.translate(x,y);ctx.rotate(rot);

    ctx.beginPath();

    for(let i=0;i<10;i++){

      const a=(i*Math.PI/5)-Math.PI/2;

      const rad=i%2===0 ? r : r*.42;

      i===0 ? ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);

    }

    ctx.closePath();

    ctx.fillStyle=color;ctx.fill();

    ctx.restore();

  }



  const STARS=Array.from({length:45},()=>({

    x:Math.random()*window.innerWidth,

    y:Math.random()*window.innerHeight,

    r:2.5+Math.random()*5,

    speed:.35+Math.random()*.55,

    drift:(Math.random()-.5)*.28,

    rot:Math.random()*Math.PI*2,

    spin:(Math.random()-.5)*.018,

    alpha:.08+Math.random()*.1,

    hue:HUES[Math.floor(Math.random()*3)],

    lit:0

  }));



  let cx = -9999, cy = -9999;
  window.addEventListener('mousemove', (e) => { cx = e.clientX; cy = e.clientY; }, { passive: true });

  function bgFrame(){

    bgX.clearRect(0,0,bW,bH);

    STARS.forEach(s=>{

      s.y+=s.speed;s.x+=s.drift;s.rot+=s.spin;

      if(s.y>bH+20){s.y=-20;s.x=Math.random()*bW;}



      const dist=Math.hypot(cx-s.x,cy-s.y);

      const prox=Math.max(0,1-dist/110);

      s.lit=Math.max(s.lit*.94,prox);



      const sz=s.r+(s.lit*6.5);

      const a=s.alpha+(s.lit*.6);

      const color=s.lit>.04

        ?`hsla(${s.hue},88%,52%,${a})`

        :`rgba(17,16,9,${s.alpha})`;



      drawStar(bgX,s.x,s.y,sz,s.rot,color);

    });

    requestAnimationFrame(bgFrame);

  }

  bgFrame();

}

      el.style.setProperty('--ink', '#2B5E39');
      el.style.setProperty('--line', 'rgba(43, 94, 57, 0.2)');

  }

  const icon = document.getElementById('themeIcon');
  if (icon) {

    overview:`18 long-form tutorial videos, planned, shot and edited to final completion — in under six weeks, delivered before the deadline, with buffers built in and multiple rounds of revision absorbed along the way. The brief was to document the VP750 and VP700 printers step by step, from printhead installation to the service station, for the company's own support site and social channels. Every video on vipcolor.com/support/how-to-videos is one of these.`,

    process:`Every video started with a written step-by-step script before the camera was touched. That script determined the shot list, the props, and the order of operations — so there were no surprises on set.\n\nThe full 18-video run was scheduled as a single production block with buffer days built in from the start. One reshoot was needed (the red block in the schedule) and it landed inside the buffer — so the deadline held.\n\nThe maths per video: roughly 1.5 hours total. Setup and soundcheck, one rehearsal pass, two to three takes, retakes if needed, then b-roll. Not faster than expected — faster because it was planned.\n\nEach shoot day ran off a run sheet that named who was on soundcheck, who was on lighting, and who was on hardware coverage. Nothing was assumed.\n\nEvery deliverable had its own status in the project tracker, so nothing slipped quietly. By the time a video was handed over, it had already been through review.`,

// Format string for captions and alt text
function formatName(str) {
    let rawName = str.split('/').pop().replace(/\.[^/.]+$/, "");
    const overrides = {
        '3': 'Campaign Poster & Graphic System',
        '4': 'Digital Web Ad — 01',
        '5': 'Digital Web Ad — 02',
        '6': 'Merchandise & Apparel Mockup',
        '7': 'Eco Packaging & Product Suite',
        'GO BUNNY': 'Primary Logo Lockup',
        'Your paragraph text (33)': 'Brand Pattern & Texture',
        'Your paragraph text (35)': 'Badge Logo & Emblem',
        'Your paragraph text (36)': 'Logo Inverse Lockup',
        'Your paragraph text (30)': 'Cafe Frontage Mockup',
        'Your paragraph text (37)': 'Social Media Campaign Ad',
        'It is time for some strawberries': 'Mobile Ordering UI',
        'ART DIRECTION PORTFOLIO (1)': 'Billboard Mockup',
        'ART DIRECTION PORTFOLIO': 'Gift Box Packaging',
        'Copy of ART DIRECTION PORTFOLIO (3)': 'Cider Beverage Cans',
        'LOGO GREEN ARROW': 'Primary Lockup',
        'EcoFuture Color Pallette': 'Color Palette System',
        'presents': 'Brand Event Collateral',
        'GLOW SQUARE poster': 'Campaign Square Poster',
        'GLOW Web Ad Square (300 x 250 px)': 'Digital Web Campaign Ad',
        'GLOW PRESENTATION Backdrop (1)': 'Presentation Stage Backdrop',
        'GLOW PPT SLIDE': 'Presentation Slide Deck',
        'ntu banner': 'NTU Campus Web Banner',
        'wssbanner': 'WSS Event Web Banner'
    };
    if (overrides[rawName]) return overrides[rawName];
    let name = rawName.replace(/[-_]/g, ' ').replace(/\s*\(\d+\)\s*/g, ' ').trim();
    return name.charAt(0).toUpperCase() + name.slice(1);
}

function renderMedia(file, isComic = false, explicitCaption = '') {
    const isVideo = !!file.match(/\.(mp4|mov|webm)$/i);
    const isAudio = !!file.match(/\.(m4a|mp3|wav)$/i);
    const isYouTube = !!file.match(/youtube\.com|youtu\.be/i);
    const isPDF = !!file.match(/\.pdf$/i);
    const name = explicitCaption || '';
    
    let el = '';
    if (isYouTube) {
        const ytMatch = file.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([^&\?]+)/);
        if (ytMatch && ytMatch[1]) {
            const ytId = ytMatch[1];
            if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                const watchUrl = `https://www.youtube.com/watch?v=${ytId}`;
                const thumbUrl = `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`;
                el = `<div class="media-el full-width yt-fallback" style="position:relative; width:100%; aspect-ratio:16/9; background:#111; border-radius:8px; overflow:hidden; break-inside: avoid; margin-bottom: 2rem; box-shadow:0 12px 30px rgba(0,0,0,0.15);">

                        <div style="margin-top:1rem; font-family:'Clash Display',sans-serif; font-size:1.2rem; background:rgba(0,0,0,0.75); padding:0.5rem 1.25rem; border-radius:6px; text-align:center;">Watch on YouTube<br><span style="font-size:0.85rem; font-family:'General Sans',sans-serif; font-weight:normal; color:#ddd;">(Click to open)</span></div>
                    </a>
                </div>`;
            } else {
                const embedUrl = `https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1`;
                el = `<iframe class="media-el full-width" src="${embedUrl}" style="width:100%; aspect-ratio:16/9; display:block; border-radius:8px; border:none; break-inside: avoid; margin-bottom: 2rem; box-shadow:0 12px 30px rgba(0,0,0,0.15);" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
            }
        }
    } else if (isVideo) {
        el = `<video class="media-el full-width" src="${file}" controls playsinline webkit-playsinline style="width:100%; height:auto; display:block; background:var(--surf); border-radius:8px; break-inside: avoid; margin-bottom: 2rem;"></video>`;
    } else if (isAudio) {

          </div>
          <audio src="${file}" controls playsinline webkit-playsinline style="width:100%; outline:none; height:40px;"></audio>
        </div>`;
    } else if (isPDF) {

                    for (let i = 26; i <= 115; i++) mSum += freqData[i];
                    rawMid = (mSum / 90) / 255.0;
                    
                    // Treble: bins 116 to 255 (~45-100%)
                    let tSum = 0;
                    for (let i = 116; i <= 255; i++) tSum += freqData[i];
                    rawTreble = (tSum / 140) / 255.0;
                  } else if (isPlaying) {
                    // Musical Fallback
                    const bpm = track.genre === 'club' ? 128 : (track.genre === 'pop' ? 118 : 84);
                    const beatPeriod = 60 / bpm;
                    const phase = (cTime % beatPeriod) / beatPeriod;
                    rawBass = (phase < 0.15) ? 0.75 : Math.max(0.08, Math.pow(1 - phase, 2.0) * 0.6);
                    rawMid = 0.25 + Math.sin(cTime * 3.5) * 0.2;
                    rawTreble = 0.2 + Math.cos(cTime * 5.0) * 0.18;
                  } else {
                    // Idle state
                    rawBass = 0.05;
                    rawMid = 0.08;
                    rawTreble = 0.05;
                  }
                  
                  // Asymmetric Attack / Decay Smoothing
                  smoothBass = applyAttackDecay(rawBass, smoothBass);
                  smoothMid = applyAttackDecay(rawMid, smoothMid);
                  smoothTreble = applyAttackDecay(rawTreble, smoothTreble);
                  
                  // Bass Peak / Onset Detection for "Hit" events
                  const nowMs = performance.now();
                  isBassHit = false;
                  if (smoothBass > 0.40 && (smoothBass - prevSmoothBass) > 0.07 && (nowMs - lastHitTime) > 280) {
                    isBassHit = true;
                    lastHitTime = nowMs;
                  }
                  prevSmoothBass = smoothBass;
                  
                  ctx.globalCompositeOperation = 'source-over';
                  
                  // ================================================================
                  // 1. CLUB GOT BOOTS — IMMERSIVE RAVE LIGHT ARCHITECTURE (STAGE & LASER)
                  // ================================================================
                  // ================================================================
                  // 1. CLUB GOT BOOTS — HARMONIC CHROMATIC RAVE STAGE (TOUCHDESIGNER GRADE)
                  // ================================================================
                  // ================================================================
                  // 1. CLUB GOT BOOTS — BOILER ROOM / RAVE LASER HORIZON & OSCILLOSCOPE STAGE
                  // ================================================================
                  if (track.genre === 'club') {
                    // Deep warehouse carbon black
                    ctx.fillStyle = '#020403';
                    ctx.fillRect(0, 0, W, H);
                    
                    const activeGain = (audio.muted || audio.volume <= 0.01) ? 0 : audio.volume;
                    
                    // 1. Audio Energy Extraction from Real FFT Data
                    let subEnergy = 0;    // Kick / Sub (40Hz)
                    let bassEnergy = 0;   // Bassline (150Hz)
                    let midEnergy = 0;    // Chords / Claps (1kHz)
                    let leadEnergy = 0;   // Leads (3kHz)
                    let hatEnergy = 0;    // Hi-Hats (8kHz)
                    let airEnergy = 0;    // Air / Sizzle (16kHz)
                    
                    // Prefer the pre-analyzed, per-frame spectrum baked for this exact
                    // track (scripts/track_spectrum.js) over the generic live AnalyserNode
                    // extraction below -- it drives all 6 energy bands (the live path only
                    // fills 4, leaving lead/air always at 0) and was hand-tuned to this
                    // track's actual beat instead of a generic bin-range split. This used
                    // to be the fallback, but the live-analyser check above it (freqData[10]
                    // > 0) is true almost as soon as any bass-heavy audio plays, so the
                    // tuned data was effectively never reached in practice.
                    if (isPlaying && window.TRACK_SPECTRUM && window.TRACK_SPECTRUM['club']) {
                      const cData = window.TRACK_SPECTRUM['club'];
                      const fIdx = Math.floor(audio.currentTime * cData.fps);
                      if (cData.frames && fIdx < cData.frames.length) {
                        const f = cData.frames[fIdx];
                        airEnergy = (f[0] || 0) * 1.5;
                        hatEnergy = (f[1] || 0) * 1.4;
                        leadEnergy = (f[2] || 0) * 1.2;
                        midEnergy = (f[3] || 0) * 1.1;
                        bassEnergy = (f[4] || 0) * 1.2;
                        subEnergy = (f[5] || 0) * 1.3;
                      }
                    } else if (freqData && isPlaying && freqData[10] > 0) {
                      // Live Web Audio AnalyserNode (fallback if no baked data is available)
                      let sSum = 0, bSum = 0, mSum = 0, hSum = 0;
                      for (let b = 1; b <= 6; b++) sSum += freqData[b];
                      for (let b = 7; b <= 20; b++) bSum += freqData[b];
                      for (let b = 21; b <= 70; b++) mSum += freqData[b];
                      for (let b = 71; b <= 200; b++) hSum += freqData[b];
                      subEnergy = (sSum / 6) / 255.0;
                      bassEnergy = (bSum / 14) / 255.0;
                      midEnergy = (mSum / 50) / 255.0;
                      hatEnergy = (hSum / 130) / 255.0;
                    }
                    
                    subEnergy = Math.max(0, Math.min(1.0, subEnergy * activeGain));
                    bassEnergy = Math.max(0, Math.min(1.0, bassEnergy * activeGain));
                    midEnergy = Math.max(0, Math.min(1.0, midEnergy * activeGain));
                    hatEnergy = Math.max(0, Math.min(1.0, hatEnergy * activeGain));
                    airEnergy = Math.max(0, Math.min(1.0, airEnergy * activeGain));
                    
                    // 2. Rolling Average Kick Onset Detection (Moving Window)
                    bassHistory.push(subEnergy);
                    if (bassHistory.length > 30) bassHistory.shift();
                    const avgBass = bassHistory.reduce((a, b) => a + b, 0) / (bassHistory.length || 1);
                    
                    let kickPunch = 0;
                    const isDynamicKick = (subEnergy > avgBass * 1.28 + 0.06) && (nowMs - lastKickTime > 200) && activeGain > 0;
                    if (isDynamicKick) {
                      lastKickTime = nowMs;
                    }
                    
                    const timeSinceKick = nowMs - lastKickTime;
                    if (timeSinceKick < 350 && activeGain > 0) {
                      kickPunch = (1.0 - (timeSinceKick / 350));
                      kickPunch = Math.pow(kickPunch, 2.0); // Snappy exponential decay
                    }
                    
                    // Smooth continuous bands for fluid motion
                    smoothBass = applyAttackDecay(subEnergy, smoothBass, 0.85, 0.12);
                    smoothMid = applyAttackDecay(midEnergy, smoothMid, 0.70, 0.08);
                    smoothTreble = applyAttackDecay(hatEnergy, smoothTreble, 0.90, 0.16);
                    
                    // 3. PERSPECTIVE LASER HORIZON WIREFRAME (Floor & Ceiling Grid)
                    const horizonY = H * 0.52;
                    const fov = Math.min(W, H) * 0.85;
                    const gridSpeed = (cTime * 180) % 100;
                    
                    ctx.save();
                    
                    // Perspective Floor Lines
                    const numVLines = 18;
                    for (let i = -numVLines / 2; i <= numVLines / 2; i++) {
                      const xNorm = i / (numVLines / 2);
                      const topX = W / 2 + xNorm * (W * 0.15);
                      const botX = W / 2 + xNorm * (W * 1.15);
                      
                      const lineAlpha = (1.0 - Math.abs(xNorm) * 0.6) * (0.08 + smoothBass * 0.18 + kickPunch * 0.25);
                      ctx.strokeStyle = kickPunch > 0.3 ? `rgba(235, 255, 245, ${lineAlpha})` : `rgba(0, 255, 102, ${lineAlpha})`;
                      ctx.lineWidth = 1;
                      ctx.beginPath();
                      ctx.moveTo(topX, horizonY);
                      ctx.lineTo(botX, H);
                      ctx.stroke();
                    }
                    
                    // Horizontal Depth Rings (Moving forward in perspective)
                    for (let d = 1; d <= 8; d++) {
                      const z = (d * 50 - gridSpeed) / 400;
                      if (z > 0.02 && z < 1.0) {
                        const y = horizonY + Math.pow(z, 2.2) * (H - horizonY);
                        const hAlpha = (1.0 - z) * z * (0.15 + smoothBass * 0.35 + kickPunch * 0.40);
                        ctx.strokeStyle = `rgba(0, 255, 102, ${hAlpha})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(W, y);
                        ctx.stroke();
                      }
                    }
                    
                    ctx.restore();
                    
                    // 4. KINETIC AUDIO OSCILLOSCOPE WAVEFORM RIBBON (Across the Horizon)
                    ctx.save();
                    const numWavePoints = 120;
                    const waveAmp = (25 + smoothBass * 80 + kickPunch * 60) * activeGain;
                    
                    // Sub-Bass Glow Ribbon
                    ctx.beginPath();
                    for (let i = 0; i <= numWavePoints; i++) {
                      const wx = (i / numWavePoints) * W;
                      const normX = (i / numWavePoints - 0.5) * 2;
                      const envelope = Math.cos(normX * Math.PI * 0.5); // Center taper
                      
                      const freqWave = Math.sin(i * 0.35 + cTime * 8.0) * (smoothMid * 0.6);
                      const kickWave = Math.sin(i * 0.15 - cTime * 12.0) * (smoothBass * 0.8);
                      const hatSpark = (Math.random() - 0.5) * (smoothTreble * 18);
                      
                      const wy = horizonY + (freqWave + kickWave) * waveAmp * envelope + hatSpark;
                      if (i === 0) ctx.moveTo(wx, wy);
                      else ctx.lineTo(wx, wy);
                    }
                    
                    ctx.strokeStyle = kickPunch > 0.2 ? `rgba(245, 255, 250, ${0.4 + kickPunch * 0.5})` : `rgba(0, 255, 102, ${0.25 + smoothBass * 0.45})`;
                    ctx.lineWidth = 2.0 + kickPunch * 1.5;
                    ctx.stroke();
                    ctx.restore();
                    
                    // 5. TRANSIENT LASER HORIZON BEAM ON BEAT DROPS
                    if (kickPunch > 0.05 && activeGain > 0) {
                      ctx.save();
                      // Intense Core Laser Line
                      ctx.strokeStyle = `rgba(255, 255, 255, ${kickPunch * 0.85})`;
                      ctx.lineWidth = 2.0;
                      ctx.beginPath();
                      ctx.moveTo(0, horizonY);
                      ctx.lineTo(W, horizonY);
                      ctx.stroke();
                      
                      // Volumetric Laser Haze
                      const laserHaze = ctx.createLinearGradient(0, horizonY - 40 * kickPunch, 0, horizonY + 40 * kickPunch);
                      laserHaze.addColorStop(0, 'rgba(0, 255, 102, 0)');
                      laserHaze.addColorStop(0.5, `rgba(0, 255, 102, ${kickPunch * 0.35})`);
                      laserHaze.addColorStop(1, 'rgba(0, 255, 102, 0)');
                      ctx.fillStyle = laserHaze;
                      ctx.fillRect(0, horizonY - 40 * kickPunch, W, 80 * kickPunch);
                      ctx.restore();
                    }
                    
                    // 6. ATMOSPHERIC HI-HAT STARDUST PARTICLES (Warehouse Smoke Glitter)
                    if (cloudyDots && isPlaying && activeGain > 0) {
                      ctx.save();
                      const trebleSpark = Math.max(0, smoothTreble);
                      for (let i = 0; i < 40; i++) {
                        const pt = cloudyDots[i];
                        const px = (pt.xRel * W + cTime * 25) % W;
                        const py = pt.yRel * H;
                        const pAlpha = (pt.baseAlpha * 0.4 + trebleSpark * 0.6) * activeGain;
                        const pSize = 1.0 + (trebleSpark * 2.0);
                        
                        ctx.fillStyle = (i % 3 === 0) ? `rgba(235, 255, 245, ${pAlpha})` : `rgba(0, 255, 102, ${pAlpha})`;
                        ctx.beginPath();
                        ctx.arc(px, py, pSize, 0, Math.PI * 2);
                        ctx.fill();
                      }
                      ctx.restore();
                    }
                    
                    // 7. SUBTLE HARDWARE TELEMETRY BADGES
                    ctx.font = '600 9px "SF Mono", "Fira Code", monospace';
                    ctx.fillStyle = 'rgba(0, 255, 102, 0.40)';
                    ctx.textAlign = 'left';
                    ctx.fillText(`128 BPM // ACID RAVE MATRIX // PEAK: ${Math.round(smoothBass * 100)}%`, W * 0.05, H * 0.94);
                    
                    // 8. CINEMATIC STAGE VIGNETTE
                    const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.85);
                    vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    vignette.addColorStop(1, 'rgba(1, 3, 2, 0.85)');
                    ctx.fillStyle = vignette;
                    ctx.fillRect(0, 0, W, H);
                  }

                  else if (track.genre === 'experimental') {
                    // 1. Render Synchronized Cloudy Days Music Video (Pure & Clean)
                    if (bgVideo && bgVideo.readyState >= 2) {
                      const vW = bgVideo.videoWidth || 1280;
                      const vH = bgVideo.videoHeight || 720;
                      const scale = Math.max(W / vW, H / vH);
                      const sW = vW * scale;
                      const sH = vH * scale;
                      const sX = (W - sW) / 2;
                      const sY = (H - sH) / 2;
                      ctx.drawImage(bgVideo, sX, sY, sW, sH);

                    }
                    
                    // 2. Cinematic Soft Stage Vignette (Clean contrast for deck)

                    expVignette.addColorStop(0, 'rgba(8, 11, 16, 0.15)');
                    expVignette.addColorStop(1, 'rgba(3, 5, 8, 0.80)');
                    ctx.fillStyle = expVignette;
                    ctx.fillRect(0, 0, W, H);
                  }
                  
                  // ================================================================
                  // 3. PARADISE — UNIVERSE VISUALIZER WITH STARS & CONSTELLATIONS
                  // ================================================================
                  else if (track.genre === 'pop') {

                    popVignette.addColorStop(0, 'rgba(15, 6, 22, 0.15)');
                    popVignette.addColorStop(1, 'rgba(4, 2, 7, 0.80)');

                            // Keyboard Spacebar Play/Pause, Volume, and Skip Controls

                .aocs-pal figure { margin:0; }
                .aocs-pal .chip { height:clamp(140px,18vw,220px); }
                .aocs-pal figcaption { padding:.9rem clamp(.8rem,1.6vw,1.4rem) 1.4rem; color:#292121; }
                .aocs-pal b { display:block; font-size:.82rem; letter-spacing:.05em; font-weight:700; }
                .aocs-pal span { display:block; font-size:.72rem; line-height:1.45; margin-top:.28rem; color:#5A524A; }

                /* ---- two-up and three-up ---- */
                .aocs-two { display:grid; grid-template-columns:1fr 1fr; gap:1.6rem; align-items:start; }
                .aocs-three { display:grid; grid-template-columns:repeat(3,1fr); gap:1.4rem; align-items:start; }
                .aocs-sheet {
                  background:#fff; border-radius:8px; padding:14px;
                  box-shadow:0 10px 26px -14px rgba(24,18,10,.5);
                }
                .aocs-sheet img { display:block; width:100%; height:auto; }

                /* Application and imagery plates share one aspect so a row reads as
                   a row. Without this the mug floated half the height of the shelter. */
                .aocs-app img { aspect-ratio:4/3; object-fit:cover; object-position:center; background:#EDE7DC; }
                .aocs-imgset img { aspect-ratio:3/4; object-fit:cover; object-position:center; }

                /* ---- pull quote ---- */
                .aocs-quote {
                  font-family:var(--fd); font-weight:700; letter-spacing:-.02em;
                  font-size:clamp(1.7rem,4.2vw,3rem); line-height:1.12;
                  color:var(--brown); margin:0; max-width:18ch;
                }
                .aocs-quote em { font-style:normal; color:var(--olive); }

                /* ---- closing ---- */
                .aocs-end {
                  /* Sits outside .aocs in the DOM, so it carries its own values
                     rather than inheriting tokens that are not in scope here. */
                  background:#46301E; color:#F8F6F3;
                  padding:clamp(3.5rem,9vw,7rem) 1.5rem; text-align:center;
                }
                .aocs-end p {
                  font-family:var(--fd); font-weight:700; margin:0;
                  font-size:clamp(1.4rem,3.4vw,2.4rem); letter-spacing:-.01em;
                }

                @media (max-width:820px){
                  .aocs-two, .aocs-three { grid-template-columns:1fr; }
                  .aocs-rev { grid-template-columns:repeat(2,1fr); }
                  .aocs-pal { grid-template-columns:repeat(2,1fr); }
                  .aocs-sec { margin:3.75rem 0; }
                }
              </style>`;

              const rev = [
                ['#7B7A49', A+'ampersand-cream.svg', 'On olive'],
                ['#502506', A+'ampersand-cream.svg', 'On brown'],
                ['#AFBF63', A+'ampersand.svg',       'On green'],
                ['#292121', A+'ampersand-cream.svg', 'On ink']
              ].map(([bg,src,label]) => `
                <figure>
                  <div class="sw" style="background:${bg}"><img src="${src}" alt="" loading="lazy"></div>
                  <figcaption>${label}</figcaption>
                </figure>`).join('');

              const pal = [
                ['#292121','Ink','Body text and the darkest ground'],
                ['#502506','Brown','The mark, headlines, Acorn'],
                ['#7B7A49','Olive','Large text and grounds only, never body copy'],
                ['#AFBF63','Green','Oak, highlights, calls to action'],
                ['#F8F6F3','Cream','The page itself']
              ].map(([bg,name,role]) => `
                <figure>
                  <div class="chip" style="background:${bg}${bg === '#F8F6F3' ? ';box-shadow:inset 0 0 0 1px rgba(41,33,33,.14)' : ''}"></div>
                  <figcaption><b>${name}</b><span>${bg.toUpperCase()}</span><span>${role}</span></figcaption>
                </figure>`).join('');

              let h = css + '<div class="aocs">';

              // --- where it came from -------------------------------------
              h += `
                <section class="aocs-sec">
                  <p class="aocs-kicker">01 &middot; The problem</p>
                  <div class="aocs-two" style="align-items:center; gap:clamp(1.6rem,4vw,3.5rem)">
                    <div>
                      <p class="aocs-quote">The algorithm is the problem. <em>Not your child.</em></p>
                      <p class="aocs-lede" style="margin-top:1.4rem; margin-bottom:0">
                        Acorn &amp; Oak began in a garage on a Saturday, not a boardroom. The brief was
                        never to shame parents into confiscating tablets. It was to give a family
                        something better to do with the afternoon, and to move the blame onto the thing
                        that actually earns it.
                      </p>
                    </div>
                    <figure class="aocs-plate aocs-framed">
                      <img src="${A}photo-garage.jpg" alt="A parent and two children building with cardboard and a glue gun in a garage" loading="lazy">
                    </figure>
                  </div>
                </section>

                <section class="aocs-sec" id="sec-research">
                  <p class="aocs-kicker">02 &middot; Research</p>
                  <h2 class="aocs-h">Six branches, three of them load-bearing</h2>
                  <p class="aocs-lede">
                    Mapping how children actually grow up produced six branches. Kids, Parents and
                    Educational are what a roadmap gets built on. Online and Algorithms explain the
                    urgency but have no product to ship against them. Values sits under everything
                    rather than beside it. Deciding which branches carried weight was the work; the
                    map is just where it was written down.
                  </p>
                  <div class="aocs-three">
                    <div class="aocs-sheet"><img src="${A}mindmap.webp" alt="Mind map of how kids grow up" loading="lazy"></div>
                    <div class="aocs-sheet"><img src="${A}moodboard-historical.webp" alt="Historical moodboard: oak, acorns, carved wood, early tools" loading="lazy"></div>
                    <div class="aocs-sheet"><img src="${A}moodboard-contemporary.webp" alt="Contemporary moodboard: acorn and oak marks, wood textures" loading="lazy"></div>
                  </div>
                </section>

                <section class="aocs-sec" id="sec-naming">
                  <p class="aocs-kicker">03 &middot; Naming</p>
                  <h2 class="aocs-h">Two names killed, and why</h2>
                  <p class="aocs-lede">
                    The brand had to speak to a child and to the parent holding the card. Most
                    candidates could only manage one of those.
                  </p>
                  <ol class="aocs-names">
                    <li class="aocs-name aocs-name--dead">
                      <span class="aocs-name-word">Sprout</span>
                      <p>Growth in one syllable and easy for a five-year-old to say, but the baby and
                      childcare space is already full of it. It would have been lost inside a week.</p>
                    </li>
                    <li class="aocs-name aocs-name--dead">
                      <span class="aocs-name-word">Wonderwood</span>
                      <p>Leans straight into imagination and real materials. It speaks to the kid and
                      says almost nothing to the parent, who is the one actually paying.</p>
                    </li>
                    <li class="aocs-name aocs-name--live">
                      <img class="aocs-name-lock" src="${A}lockup.svg" alt="Acorn &amp; Oak" loading="lazy">
                      <p>An acorn is small and still becoming something. An oak is what shelters it
                      while it grows. One image holds both halves of the audience, and it stretches
                      into a range later: Acorn kits for kids, Oak guides for parents.</p>
                    </li>
                  </ol>
                </section>

                <section class="aocs-sec" id="sec-type">
                  <p class="aocs-kicker">04 &middot; Type</p>
                  <h2 class="aocs-h">Nine routes before one was right</h2>
                  <p class="aocs-lede">
                    Gulf Display carries the wordmark: heavy, round, warm without tipping into
                    nursery. Garet does everything else, because a brand that argues with an algorithm
                    needs a voice you can read a paragraph in. The ampersand was cut by hand rather
                    than picked, which is what makes it a drawing instead of a glyph.
                  </p>
                  <div class="aocs-three" style="margin-bottom:1.4rem">
                    <div class="aocs-sheet"><img src="${A}typeface-01.webp" alt="Typeface experiments, sheet one" loading="lazy"></div>
                    <div class="aocs-sheet"><img src="${A}typeface-02.webp" alt="Typeface experiments, sheet two" loading="lazy"></div>
                    <div class="aocs-sheet"><img src="${A}typeface-03.svg" alt="Typeface experiments, sheet three" loading="lazy"></div>
                  </div>
                  <div class="aocs-two">
                    <div class="aocs-sheet"><img src="${A}gulf-display.svg" alt="Chosen font: Gulf Display" loading="lazy"></div>
                    <div class="aocs-sheet"><img src="${A}garet.svg" alt="Secondary typeface: Garet" loading="lazy"></div>
                  </div>
                </section>

                <section class="aocs-sec" id="sec-mark">
                  <p class="aocs-kicker">05 &middot; The mark</p>
                  <h2 class="aocs-h">An acorn and an animal, in one glyph</h2>
                  <p class="aocs-lede">
                    A mark that only survives on white is not finished. This one was tested reversed,
                    in one colour, on four grounds and at mug scale before it was called final.
                  </p>
                  <div class="aocs-rev">${rev}</div>
                </section>
              `;

              // --- colour, full bleed -------------------------------------
              h += `
                <section class="aocs-sec" id="sec-colour">
                  <p class="aocs-kicker">06 &middot; Colour</p>
                  <h2 class="aocs-h">Five colours, each with a job</h2>
                  <p class="aocs-lede">
                    Earth before accent. Olive is a ground and a large-text colour, never body copy,
                    because it only reaches 4.1:1 on cream. Green carries Oak and anything that asks
                    to be clicked.
                  </p>
                </section>
                <div class="aocs-bleed"><div class="aocs-pal">${pal}</div></div>
              `;

              // --- sub-brands ---------------------------------------------
              h += `
                <section class="aocs-sec" id="sec-system">
                  <p class="aocs-kicker">07 &middot; Sub-brands</p>
                  <h2 class="aocs-h">Acorn for kids, Oak for parents</h2>
                  <p class="aocs-lede">
                    The name decided the product architecture rather than the other way round. Acorn is
                    the physical activity centre, built out of the original garage Saturdays. Oak is the
                    parent network that stops unplugged parenting being a solo battle.
                  </p>
                  <div class="aocs-two">
                    <figure class="aocs-plate aocs-framed"><img src="${A}acorn.svg" alt="Acorn: kids activity centre" loading="lazy"></figure>
                    <figure class="aocs-plate aocs-framed"><img src="${A}oak.svg" alt="Oak: parent network app" loading="lazy"></figure>
                  </div>
                </section>

                <section class="aocs-sec" id="sec-campaign">
                  <p class="aocs-kicker">08 &middot; In the world</p>
                  <h2 class="aocs-h">Where a parent already is</h2>
                  <p class="aocs-lede">
                    The line only lands if it is placed where the argument is already happening: a
                    station wall on the commute home, a bus shelter opposite a playground.
                  </p>
                </section>
              `;

              h += `<div class="aocs-bleed"><figure class="aocs-plate"><img src="${A}mockup-subway.webp" alt="Subway poster: the algorithm is the problem, not your child" loading="lazy"></figure></div>`;

              h += `
                <section class="aocs-sec">
                  <div class="aocs-three">
                    <figure class="aocs-plate aocs-framed aocs-app"><img src="${A}mockup-busstop.webp" alt="Bus shelter poster: let's take a new ground" loading="lazy"></figure>
                    <figure class="aocs-plate aocs-framed aocs-app"><img src="${A}mockup-hoodie.webp" alt="The ampersand on a hoodie" loading="lazy"></figure>
                    <figure class="aocs-plate aocs-framed aocs-app"><img src="${A}mockup-mug.webp" alt="The ampersand on a mug" loading="lazy"></figure>
                  </div>
                  <p class="aocs-cap">The mark had to survive a chest print and a curved ceramic handle. That is the
                  reason it was drawn as a solid silhouette rather than an outline.</p>
                </section>

                <section class="aocs-sec">
                  <div class="aocs-three aocs-imgset">
                    <figure class="aocs-plate aocs-framed"><img src="${A}photo-pottery.webp" alt="Hands painting a clay pot" loading="lazy"></figure>
                    <figure class="aocs-plate aocs-framed"><img src="${A}photo-log.webp" alt="Children walking along a fallen log" loading="lazy"></figure>
                    <figure class="aocs-plate aocs-framed"><img src="${A}photo-football.webp" alt="A parent and child playing football on grass" loading="lazy"></figure>
                  </div>
                  <p class="aocs-cap">Brand imagery: hands, ground, weather. Nothing shot through a screen.</p>
                </section>
              `;

              h += `</div><div class="aocs-bleed aocs-end"><p>It's time to ground ourselves.</p></div>`;

              gal.innerHTML = h;
              if (window.lucide) window.lucide.createIcons();
              return;
          }

          // 9.5 GROUPED GALLERY (opt-in via p.groups)
          // One flat masonry reflows into columns, which scrambles any order the
          // files were listed in -- a sequence that reads as an argument on paper
          // arrives as a pile of nice pictures. A project can now declare groups,
          // each matching files by substring, and each renders as its own
          // .cs-section with its own heading. Reuses the case-study classes that
          // gobunny and green-arrow already use rather than adding a third system.
          // Anything a group doesn't claim still renders, under a final heading,
          // so a file can never be silently dropped by a typo in a match rule.
          if (p.groups && p.groups.length) {
              const claimed = new Set();
              const pick = (rules) => media.filter(f => {
                  if (claimed.has(f)) return false;
                  const hit = rules.some(r => f.toLowerCase().includes(r.toLowerCase()));
                  if (hit) claimed.add(f);
                  return hit;
              });
              let htmlStr = styleBlock;
              p.groups.forEach(g => {
                  const files = pick(g.match || []);
                  if (!files.length) return;
                  htmlStr += `
                    <div class="cs-section" id="sec-${g.id}">
                      <h2 class="cs-heading">${g.title}</h2>
                      ${g.note ? `<p style="margin:-0.75rem 0 1.75rem; max-width:70ch; font-size:0.98rem; line-height:1.65; color:var(--ink5);">${g.note}</p>` : ''}
                      <div class="masonry-container">${files.map(f => renderMedia(f)).join('')}</div>
                    </div>`;
              });
              const rest = media.filter(f => !claimed.has(f));
              if (rest.length) {
                  htmlStr += `
                    <div class="cs-section" id="sec-more">
                      <h2 class="cs-heading">Also from the build</h2>
                      <div class="masonry-container">${rest.map(f => renderMedia(f)).join('')}</div>
                    </div>`;
              }
              gal.innerHTML = htmlStr;
              if (window.lucide) window.lucide.createIcons();
              return;
          }

          // 10. DEFAULT / ALL OTHER GALLERIES
          const isComic = id === 'wellbeing-planner' || id === 'jasmine-comic';
          // Six full-width YouTube embeds stacked read as too much scroll for one
          // section (six full rows on desktop). vipcolor-video specifically opts
          // into a 2-column grid so 6 items become 3 rows -- .vids-2col below
          // cancels the CSS-columns layout and the .full-width column-span rule.
          const _twoCol = (id === 'vipcolor-video') ? ' vids-2col' : '';
          let htmlStr = styleBlock + `<div class="${isComic ? 'comic-grid' : 'masonry-container' + _twoCol}">`;
          
          media.forEach((file) => {
              htmlStr += renderMedia(file, isComic);
          });
          htmlStr += '</div>';
          gal.innerHTML = htmlStr;
      }
  }, 50);
</script>

<script>
    // BFCache fix for blank pages on back button navigation
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            document.body.classList.remove('page-exit');
        }
    });

<!-- Option B: Page Transition Overlay -->
<div id="page-trans" class="page-trans-overlay" aria-hidden="true"></div>

<script>
// === OPTION C: TACTILE INTERACTIVE SLIDER LOGIC ===
function initComparisonSliders() {
  const wrappers = document.querySelectorAll('.comparison-slider-wrapper');
  wrappers.forEach(wrap => {
    const slider = wrap.querySelector('.comparison-slider');
    if (!slider || slider.dataset.initialized) return;
    slider.dataset.initialized = 'true';

    // Adaptive aspect-ratio detection to prevent abnormal cropping
    const imgBefore = slider.querySelector('.comp-img-before');
    const imgAfter = slider.querySelector('.comp-img-after');
    
    function applyNaturalRatio() {
      const bw = imgBefore ? (imgBefore.naturalWidth || 0) : 0;
      const bh = imgBefore ? (imgBefore.naturalHeight || 0) : 0;
      const aw = imgAfter ? (imgAfter.naturalWidth || 0) : 0;
      const ah = imgAfter ? (imgAfter.naturalHeight || 0) : 0;
      
      let nw = bw || aw;
      let nh = bh || ah;
      
      // If both images are loaded, prefer the wider ratio to avoid lateral cropping of panoramic artwork
      if (bw && bh && aw && ah) {
        const ratioB = bw / bh;
        const ratioA = aw / ah;
        if (Math.abs(ratioB - ratioA) > 0.15) {
          if (ratioA > ratioB) {
            nw = aw;
            nh = ah;
          } else {
            nw = bw;
            nh = bh;
          }
        }
      }

      if (nw && nh) {
        const ratio = nw / nh;
        slider.style.aspectRatio = `${nw} / ${nh}`;
        if (ratio < 0.85) {
          // Tall portrait (e.g. comic pages, vertical posters)
          slider.style.maxWidth = `${Math.min(540, Math.round(620 * ratio))}px`;
        } else if (ratio <= 1.25) {
          // Square or near-square (e.g. 1:1 brand identity, square color keys)
          slider.style.maxWidth = '580px';
        } else {
          slider.style.maxWidth = '100%';
        }
      }
    }

    if (imgBefore) {
      if (imgBefore.complete && imgBefore.naturalWidth > 0) {
        applyNaturalRatio();
      } else {
        imgBefore.addEventListener('load', applyNaturalRatio);
      }
    }
    if (imgAfter && (!imgAfter.complete || imgAfter.naturalWidth === 0)) {
      imgAfter.addEventListener('load', applyNaturalRatio);
    }

    const presetBtns = wrap.querySelectorAll('.cs-preset-btn');
    let currentPct = 50;

    function setPosition(pct, isSmooth = false) {
      pct = Math.max(2, Math.min(98, pct));
      currentPct = pct;
      if (isSmooth) {
        slider.style.transition = '--split-pos 0.25s cubic-bezier(0.2, 0.9, 0.3, 1)';
        setTimeout(() => { slider.style.transition = ''; }, 260);
      }
      slider.style.setProperty('--split-pos', pct + '%');
      slider.setAttribute('aria-valuenow', Math.round(pct));

      // Update preset buttons active state
      presetBtns.forEach(btn => {
        const bPos = parseFloat(btn.dataset.pos);
        btn.classList.toggle('active', Math.abs(bPos - pct) < 18);
      });
    }

    presetBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const pos = parseFloat(btn.dataset.pos);
        setPosition(pos, true);
      });
    });

    let isDown = false;
    function updateFromClientX(clientX) {
      const rect = slider.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
      const pct = (x / rect.width) * 100;
      setPosition(pct, false);
    }

    slider.addEventListener('mousedown', (e) => {
      isDown = true;
      slider.classList.add('is-dragging');
      updateFromClientX(e.clientX);
    });

    window.addEventListener('mousemove', (e) => {
      if (isDown) {
        e.preventDefault();
        updateFromClientX(e.clientX);
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDown) {
        isDown = false;
        slider.classList.remove('is-dragging');
      }
    });

    slider.addEventListener('touchstart', (e) => {
      isDown = true;
      slider.classList.add('is-dragging');
      if (e.touches.length) updateFromClientX(e.touches[0].clientX);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDown && e.touches.length) {
        updateFromClientX(e.touches[0].clientX);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (isDown) {
        isDown = false;
        slider.classList.remove('is-dragging');
      }
    });

    // Keyboard accessibility (← / → arrow keys)
    slider.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        setPosition(currentPct - 5, true);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        setPosition(currentPct + 5, true);
      }
    });
  });
}

// === OPTION B: PAGE TRANSITION INTERCEPTOR ===
(function initPageTransitions() {
  const overlay = document.getElementById('page-trans');
  if (!overlay) return;

  window.addEventListener('pageshow', () => {
    overlay.classList.remove('active');
  });

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('mailto:') || a.target === '_blank' || href.startsWith('javascript:')) return;
    if (href.startsWith('http://') || href.startsWith('https://')) return;

    e.preventDefault();
    overlay.classList.add('active');
    setTimeout(() => {
      window.location.href = href;
    }, 220);
  });
})();

// Initialize sliders after DOM ready
window.addEventListener('DOMContentLoaded', initComparisonSliders);
setTimeout(initComparisonSliders, 400);
</script>
